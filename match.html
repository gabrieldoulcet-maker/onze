<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONZE — Prototype de match</title>
  <style>
    /* ============================================================
       ONZE — Prototype de résolution de match (phase 1, sur papier)
       Décision n°5 : match par phases de possession, ~40 s au total,
       duels zone par zone, tirs façon xG. Zéro action pendant le match.
       Mobile-first portrait.
       ============================================================ */
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #101711;
      color: #E7EEE7;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 40px;
    }
    header { text-align: center; margin-bottom: 12px; }
    header h1 { font-size: 1.6rem; margin: 0; letter-spacing: 2px; }
    header h1 span { color: #4FC57C; }
    header p { color: #96A699; margin: 4px 0 0; font-size: 0.85rem; }

    /* ---- Tableau d'affichage (score) ---- */
    .tableau {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      background: #182219;
      border: 1px solid #24331F;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .equipe-nom { font-weight: 700; font-size: 0.95rem; text-align: center; }
    .equipe-nom small { display: block; font-weight: 400; color: #96A699; font-size: 0.7rem; margin-top: 2px; }
    .score {
      font-size: 2rem;
      font-weight: 800;
      background: #0B100C;
      border-radius: 8px;
      padding: 4px 14px;
      min-width: 92px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .chrono { grid-column: 1 / -1; text-align: center; color: #96A699; font-size: 0.8rem; min-height: 1.1em; }

    /* ---- Effectifs (les deux équipes de test) ---- */
    .effectifs {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .effectif {
      background: #182219;
      border: 1px solid #24331F;
      border-radius: 10px;
      padding: 8px;
      font-size: 0.78rem;
    }
    .effectif h2 { font-size: 0.8rem; margin: 0 0 6px; color: #4FC57C; }
    .effectif ul { list-style: none; margin: 0; padding: 0; }
    .effectif li { display: flex; justify-content: space-between; padding: 2px 0; color: #C9D6C9; }
    .effectif .poste { color: #96A699; font-size: 0.7rem; min-width: 30px; }

    /* ---- Bouton principal ---- */
    button.principal {
      width: 100%;
      max-width: 420px;
      background: #4FC57C;
      color: #0B100C;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 14px;
    }
    button.principal:disabled { background: #2A3A2C; color: #6C7A6E; }

    /* ---- Récit du match, phase par phase ---- */
    .recit {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .phase {
      background: #182219;
      border-left: 3px solid #35502F;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.88rem;
      line-height: 1.45;
      animation: apparait 0.4s ease;
    }
    .phase .titre-phase { color: #96A699; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
    .phase.but { border-left-color: #4FC57C; background: #1B2E1E; }
    .phase.but .cri { color: #4FC57C; font-weight: 800; font-size: 1rem; }
    .phase.final { border-left-color: #E8C547; background: #262516; text-align: center; font-weight: 700; }
    @keyframes apparait {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>ON<span>ZE</span></h1>
    <p>Prototype — match par phases de possession (~40 s)</p>
  </header>

  <div class="tableau">
    <div class="equipe-nom" id="nom-a"></div>
    <div class="score"><span id="score-a">0</span> – <span id="score-b">0</span></div>
    <div class="equipe-nom" id="nom-b"></div>
    <div class="chrono" id="chrono"></div>
  </div>

  <div class="effectifs">
    <div class="effectif" id="liste-a"></div>
    <div class="effectif" id="liste-b"></div>
  </div>

  <button class="principal" id="btn-simuler">⚽ Simuler le match</button>

  <div class="recit" id="recit"></div>

  <script>
    /* ============================================================
       DONNÉES DE TEST — deux équipes de 5 titulaires (niveau club 1 :
       on démarre à 5, décision n°4). Joueurs fictifs, décision n°6.
       Stats simples pour ce prototype :
         att = qualité offensive, def = qualité défensive (1 à 10).
       Le GAR n'utilise que def (il arrête les tirs).
       ============================================================ */
    const EQUIPE_A = {
      nom: "Racing Portuaire",
      coach: "Coach Gabriel",
      joueurs: [
        { nom: "Le Mur",        poste: "GAR", att: 1, def: 7 },
        { nom: "Capitaine Roc", poste: "DÉF", att: 2, def: 6 },
        { nom: "La Faucheuse",  poste: "DÉF", att: 3, def: 5 },
        { nom: "Métronome",     poste: "MIL", att: 5, def: 5 },
        { nom: "Le Renard",     poste: "ATT", att: 7, def: 2 },
      ],
    };
    const EQUIPE_B = {
      nom: "Étoile des Faubourgs",
      coach: "Coach Fantôme",
      joueurs: [
        { nom: "Gants d'Acier", poste: "GAR", att: 1, def: 6 },
        { nom: "Le Verrou",     poste: "DÉF", att: 2, def: 7 },
        { nom: "Sentinelle",    poste: "DÉF", att: 2, def: 6 },
        { nom: "L'Artiste",     poste: "MIL", att: 6, def: 4 },
        { nom: "Boulet Rouge",  poste: "ATT", att: 8, def: 1 },
      ],
    };

    /* ============================================================
       RÉGLAGES DU MATCH (à trancher en phase 1 — valeurs de départ
       pour le playtest, faciles à retoucher ici)
       ============================================================ */
    const NB_PHASES = 8;          // 8 phases de possession par match
    const DUREE_CIBLE_MS = 40000; // durée totale visée : ~40 secondes
    const DELAI_PHASE_MS = DUREE_CIBLE_MS / NB_PHASES; // ~5 s par phase

    // Minutes affichées pour habiller le récit (8 phases sur 90 min)
    const MINUTES = [7, 19, 31, 44, 52, 63, 77, 89];

    /* ---- Petites aides ---- */
    const de = (max) => Math.floor(Math.random() * max) + 1; // dé de 1 à max
    const somme = (js, stat) => js.reduce((t, j) => t + j[stat], 0);
    const parPoste = (eq, poste) => eq.joueurs.filter(j => j.poste === poste);
    const hasard = (tableau) => tableau[Math.floor(Math.random() * tableau.length)];

    /* ============================================================
       RÉSOLUTION D'UNE PHASE DE POSSESSION
       Trois duels lisibles, comme sur le papier :
       1. MILIEU  — qui gagne le ballon ? (milieux + un peu de hasard)
       2. ATTAQUE — l'attaque perce-t-elle la défense adverse ?
       3. TIR     — façon xG : chance de but selon la qualité de l'occasion
       Chaque étape peut échouer → la phase raconte où ça s'est arrêté.
       ============================================================ */
    function resoudrePhase(eqA, eqB) {
      // Duel n°1 : le milieu. Le vainqueur prend la possession.
      const forceMilA = somme(parPoste(eqA, "MIL"), "att") + somme(parPoste(eqA, "MIL"), "def");
      const forceMilB = somme(parPoste(eqB, "MIL"), "att") + somme(parPoste(eqB, "MIL"), "def");
      const milieuA = forceMilA + de(8);
      const milieuB = forceMilB + de(8);
      const attaque = milieuA >= milieuB ? eqA : eqB;
      const defense = attaque === eqA ? eqB : eqA;

      const porteur = hasard(parPoste(attaque, "MIL"));
      const finisseur = hasard(parPoste(attaque, "ATT"));

      // Duel n°2 : percer la défense. Attaque vs ligne défensive adverse.
      const forceAtt = somme(parPoste(attaque, "ATT"), "att") + somme(parPoste(attaque, "MIL"), "att");
      const forceDef = somme(parPoste(defense, "DÉF"), "def");
      const percee = forceAtt + de(10) > forceDef + de(10) + 1; // +1 : léger avantage à la défense

      if (!percee) {
        const defenseur = hasard(parPoste(defense, "DÉF"));
        return {
          attaque, defense, but: false,
          texte: `${porteur.nom} oriente le jeu pour ${attaque.nom}… mais ${defenseur.nom} ferme la porte. La défense de ${defense.nom} tient bon.`,
        };
      }

      // Duel n°3 : le tir, façon xG. Qualité de l'occasion vs gardien.
      const gardien = parPoste(defense, "GAR")[0];
      const qualiteOccasion = finisseur.att + de(8);        // occasion : talent + réussite
      const parade = gardien.def + de(6);                    // parade : niveau du gardien + réflexe
      const but = qualiteOccasion > parade;

      if (but) {
        return {
          attaque, defense, but: true, buteur: finisseur,
          texte: `${porteur.nom} lance ${finisseur.nom} dans la surface… frappe croisée…`,
          cri: `BUUUT de ${finisseur.nom} pour ${attaque.nom} !`,
        };
      }
      return {
        attaque, defense, but: false,
        texte: `${finisseur.nom} se retrouve en position pour ${attaque.nom}… la frappe part… mais ${gardien.nom} s'envole et détourne ! Quel arrêt !`,
      };
    }

    /* ============================================================
       DÉROULÉ DU MATCH — une phase toutes les ~5 s, récit à l'écran
       ============================================================ */
    const el = (id) => document.getElementById(id);

    function afficherEffectif(conteneur, eq) {
      conteneur.innerHTML = `<h2>${eq.nom}</h2><ul>` +
        eq.joueurs.map(j => `<li><span class="poste">${j.poste}</span><span>${j.nom}</span></li>`).join("") +
        `</ul>`;
    }

    function ajouterPhase(html, classes = "") {
      const bloc = document.createElement("div");
      bloc.className = "phase " + classes;
      bloc.innerHTML = html;
      el("recit").appendChild(bloc);
      bloc.scrollIntoView({ behavior: "smooth", block: "end" });
    }

    function simulerMatch() {
      const btn = el("btn-simuler");
      btn.disabled = true;
      btn.textContent = "Match en cours…";
      el("recit").innerHTML = "";
      let scoreA = 0, scoreB = 0;
      el("score-a").textContent = "0";
      el("score-b").textContent = "0";

      let numero = 0;

      function phaseSuivante() {
        numero++;
        const minute = MINUTES[numero - 1];
        el("chrono").textContent = `⏱ ${minute}ᵉ minute — phase ${numero}/${NB_PHASES}`;

        const r = resoudrePhase(EQUIPE_A, EQUIPE_B);
        if (r.but) {
          if (r.attaque === EQUIPE_A) scoreA++; else scoreB++;
          el("score-a").textContent = scoreA;
          el("score-b").textContent = scoreB;
          ajouterPhase(
            `<div class="titre-phase">${minute}ᵉ — Phase ${numero}</div>` +
            `${r.texte}<br><span class="cri">⚽ ${r.cri}</span> <strong>${scoreA} – ${scoreB}</strong>`,
            "but"
          );
        } else {
          ajouterPhase(
            `<div class="titre-phase">${minute}ᵉ — Phase ${numero}</div>${r.texte}`
          );
        }

        if (numero < NB_PHASES) {
          setTimeout(phaseSuivante, DELAI_PHASE_MS);
        } else {
          setTimeout(finDeMatch, DELAI_PHASE_MS / 2);
        }
      }

      function finDeMatch() {
        el("chrono").textContent = "⏱ Coup de sifflet final";
        let verdict;
        if (scoreA > scoreB) verdict = `🏆 Victoire de ${EQUIPE_A.nom} !`;
        else if (scoreB > scoreA) verdict = `🏆 Victoire de ${EQUIPE_B.nom} !`;
        else verdict = "🤝 Match nul !";
        const ecart = Math.abs(scoreA - scoreB);
        const prestige = ecart > 0 ? `<br><small style="color:#96A699">Dégâts de prestige : ${ecart} (écart de buts)</small>` : "";
        ajouterPhase(
          `Score final : <strong>${scoreA} – ${scoreB}</strong><br>${verdict}${prestige}`,
          "final"
        );
        btn.disabled = false;
        btn.textContent = "🔁 Rejouer le match";
      }

      phaseSuivante();
    }

    /* ---- Mise en place au chargement ---- */
    el("nom-a").innerHTML = `${EQUIPE_A.nom}<small>${EQUIPE_A.coach}</small>`;
    el("nom-b").innerHTML = `${EQUIPE_B.nom}<small>${EQUIPE_B.coach}</small>`;
    afficherEffectif(el("liste-a"), EQUIPE_A);
    afficherEffectif(el("liste-b"), EQUIPE_B);
    el("btn-simuler").addEventListener("click", simulerMatch);
  </script>

</body>
</html>
