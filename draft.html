<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONZE — Mercato</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>⚽</text></svg>">
  <link rel="stylesheet" href="onze.css">
</head>
<body>

  <header>
    <h1>ON<span>ZE</span></h1>
    <p>Mercato — compose ton équipe, puis joue le match</p>
  </header>

  <!-- ================= ÉCRAN MERCATO ================= -->
  <div id="ecran-mercato">

    <div class="bandeau-club">
      <div>🏟️ <strong id="mon-club">Mon Club</strong><br>
        <small style="color:var(--craie-sourde)">Niveau <span id="niveau">5</span> — <span id="nb-titulaires-max">5</span> titulaires</small></div>
      <div class="or"><span id="or">30</span>M 🪙</div>
    </div>

    <div class="section-titre"><span>Boutique</span><span id="odds-info"></span></div>
    <div class="boutique" id="boutique"></div>
    <div class="ligne-refresh">
      <button id="btn-refresh">🔄 Nouvelle boutique (2M)</button>
    </div>

    <div class="section-titre"><span>Titulaires (<span id="nb-titulaires">0</span>/<span id="nb-titulaires-max2">5</span>)</span></div>
    <div class="synergies" id="synergies-club" style="max-width:420px;width:100%;margin-bottom:6px;"></div>
    <div class="adn" id="adn"><h3>🧬 L'ADN du club</h3><div id="axes-adn"></div></div>
    <div class="groupe-cartes" id="terrain"></div>

    <div class="section-titre"><span>Banc</span></div>
    <div class="groupe-cartes" id="banc"></div>

    <div class="message-erreur" id="message"></div>
    <button class="principal" id="btn-match" disabled>Chargement…</button>
  </div>

  <!-- ================= ÉCRAN MATCH ================= -->
  <div id="ecran-match" class="masque" style="width:100%;display:flex;flex-direction:column;align-items:center;">
    <div class="tableau">
      <div class="equipe-nom" id="nom-a"></div>
      <div class="score"><span id="score-a">0</span> – <span id="score-b">0</span></div>
      <div class="equipe-nom" id="nom-b"></div>
      <div class="chrono" id="chrono"></div>
    </div>
    <button class="principal" id="btn-vitesse" style="background:var(--ligne);color:var(--craie-claire);padding:8px;font-size:0.85rem;">⏩ Accélérer ×2</button>
    <button class="principal masque" id="btn-retour">↩ Retour au mercato</button>
    <div class="recit" id="recit"></div>
  </div>

  <script src="match-moteur.js"></script>
  <script src="ecussons.js"></script>
  <script src="match-ui.js"></script>
  <script>
    /* ============================================================
       MERCATO — chiffres repris de TFT (décision n°2) :
       pool 30/25/18/10/9 copies par coût, refresh 2M,
       odds par niveau de boutique. XP et intérêts viendront
       avec les manches ; ici : une séance d'achats, un match.
       ============================================================ */
    const OR_DEPART = 30;
    const COUT_REFRESH = 2;
    const NIVEAU_CLUB = 5;          // fixe pour ce prototype
    const TITULAIRES_MAX = 5;       // montée 5 → 11 : plus tard
    const TAILLE_BOUTIQUE = 5;
    const TAILLE_BANC = 8;
    const POOL_PAR_COUT = { 1: 30, 2: 25, 3: 18, 4: 10, 5: 9 };
    // Chances d'apparition par coût, au niveau 5 (odds TFT)
    const ODDS = { 1: 45, 2: 33, 3: 20, 4: 2, 5: 0 };

    const el = (id) => document.getElementById(id);
    let tousLesJoueurs = [];
    let pool = [];        // toutes les copies restantes en circulation
    let or = OR_DEPART;
    let boutique = [];    // 5 fiches (ou null si achetée)
    let terrain = [];     // fiches titulaires
    let banc = [];        // fiches remplaçants

    /* ---- Le pool : POOL_PAR_COUT copies de chaque joueur ---- */
    function construirePool() {
      pool = [];
      for (const j of tousLesJoueurs) {
        for (let c = 0; c < (POOL_PAR_COUT[j.cout] || 0); c++) pool.push(j);
      }
    }

    /* ---- Tirage d'une carte selon les odds du niveau ---- */
    function tirerCarte() {
      const tirage = Math.random() * 100;
      let cumul = 0, coutChoisi = 1;
      for (const [cout, chance] of Object.entries(ODDS)) {
        cumul += chance;
        if (tirage < cumul) { coutChoisi = Number(cout); break; }
      }
      let candidats = pool.filter((j) => j.cout === coutChoisi);
      if (candidats.length === 0) candidats = pool; // coût épuisé : on élargit
      return candidats.length ? hasardParmi(candidats) : null;
    }
    const hasardParmi = (t) => t[Math.floor(Math.random() * t.length)];

    function nouvelleBoutique() {
      // Les cartes non achetées retournent dans le pool
      for (const c of boutique) if (c) pool.push(c);
      boutique = [];
      for (let i = 0; i < TAILLE_BOUTIQUE; i++) {
        const carte = tirerCarte();
        if (carte) pool.splice(pool.indexOf(carte), 1);
        boutique.push(carte);
      }
    }

    /* ---- Actions du joueur ---- */
    function acheter(indice) {
      const fiche = boutique[indice];
      if (!fiche) return;
      if (or < fiche.cout) return signaler("Pas assez d'or pour " + fiche.nom + ".");
      if (terrain.length + banc.length >= TITULAIRES_MAX + TAILLE_BANC)
        return signaler("Effectif complet — vends quelqu'un d'abord.");
      or -= fiche.cout;
      boutique[indice] = null;
      // Chaque copie achetée est un exemplaire à soi (1 étoile)
      const copie = { ...fiche, etoiles: 1 };
      if (terrain.length < TITULAIRES_MAX) terrain.push(copie); else banc.push(copie);
      // 3 copies identiques → fusion automatique, façon TFT
      const fusions = ONZE.fusionnerEffectif(terrain, banc);
      if (fusions.length) celebrerFusions(fusions);
      afficher();
    }
    function vendre(liste, indice) {
      const fiche = liste[indice];
      const copies = Math.pow(3, (fiche.etoiles || 1) - 1); // un 2★ vaut 3 copies
      or += fiche.cout * copies;
      const original = tousLesJoueurs.find((j) => j.nom === fiche.nom);
      for (let c = 0; c < copies; c++) pool.push(original);
      liste.splice(indice, 1);
      afficher();
    }
    function basculer(liste, indice) {
      const fiche = liste[indice];
      if (liste === banc && terrain.length >= TITULAIRES_MAX)
        return signaler("Terrain plein (" + TITULAIRES_MAX + ") — fais descendre quelqu'un d'abord.");
      liste.splice(indice, 1);
      (liste === banc ? terrain : banc).push(fiche);
      afficher();
    }
    function refresh() {
      if (or < COUT_REFRESH) return signaler("Pas assez d'or pour relancer la boutique.");
      or -= COUT_REFRESH;
      nouvelleBoutique();
      afficher();
    }

    /* La fusion, mise en scène comme l'événement qu'elle est */
    function celebrerFusions(fusions) {
      fusions.forEach((f, i) => {
        setTimeout(() => {
          const banniere = document.createElement("div");
          banniere.className = "fusion-banniere";
          banniere.innerHTML = f.etoiles >= 3
            ? `🌟 LÉGENDE DU CLUB ! 🌟<br>${f.nom} atteint les 3 étoiles !<small>Le sommet absolu — niveau maximum</small>`
            : `✨ FUSION ! ✨<br>${f.nom} devient Titulaire 2★<small>Trois copies réunies — les stats grimpent</small>`;
          document.body.appendChild(banniere);
          setTimeout(() => banniere.remove(), 2700);
        }, i * 900);
      });
    }

    function signaler(texte) {
      el("message").textContent = texte;
      setTimeout(() => { if (el("message").textContent === texte) el("message").textContent = ""; }, 2500);
    }

    /* ---- La formation est-elle valable ? (contrainte de postes) ---- */
    function verdictFormation() {
      if (terrain.length !== TITULAIRES_MAX) return "Aligne " + TITULAIRES_MAX + " titulaires.";
      const nb = (poste) => terrain.filter((j) => j.poste === poste).length;
      if (nb("GAR") > 1) return "Un seul gardien sur le terrain.";
      if (nb("DÉF") < 1) return "Il faut au moins 1 défenseur.";
      if (nb("MIL") < 1) return "Il faut au moins 1 milieu.";
      if (nb("ATT") < 1) return "Il faut au moins 1 attaquant.";
      return null; // formation valable (0 gardien permis : cage vide !)
    }

    /* ---- Affichage ---- */
    /* Carte compacte : note + 2 stats signatures ; tap → fiche complète */
    function carteHTML(fiche, actionsHTML, refFiche) {
      const etoiles = (fiche.etoiles || 1) >= 2 ? ` <span class="etoiles">${"★".repeat(fiche.etoiles)}</span>` : "";
      const stats = ONZE.genererStats(fiche);
      const note = ONZE.noteGlobale(stats);
      const signatures = ONZE.statsSignatures(stats).map((x) => `${x.nom} ${x.valeur}`).join(" · ");
      return `<div class="carte cout-${fiche.cout}" onclick="voirFiche(${refFiche})">
        <span class="note">${note}</span>
        <span class="infos"><span class="nom">${fiche.poste} · ${fiche.nom}${etoiles}</span> <span style="color:var(--or-trophee)">${fiche.cout}M</span><br>
        <span class="signatures">${signatures}</span>
        <span class="traits"> ${fiche.unique ? "⭐ " + fiche.unique + " · " : ""}${fiche.ecole ? fiche.ecole + " · " : ""}${fiche.archetype}</span></span>
        <span class="actions" onclick="event.stopPropagation()">${actionsHTML}</span>
      </div>`;
    }
    function voirFiche(ref) {
      const [nomListe, indice] = ref.split(":");
      const listes = { boutique, terrain, banc };
      const fiche = listes[nomListe][indice];
      if (!fiche) return;
      let calcule = null;
      if (nomListe === "terrain") calcule = ONZE.equipeDepuisFiches("Mon Club", "Toi", terrain).joueurs[indice];
      ONZE_UI.ouvrirFiche(fiche, calcule);
    }
    function afficher() {
      el("or").textContent = or;
      el("boutique").innerHTML = boutique.map((fiche, i) =>
        fiche
          ? carteHTML(fiche, `<button class="achat" onclick="acheter(${i})" aria-label="Acheter ${fiche.nom.replace(/"/g, "&quot;")} pour ${fiche.cout}M" ${or < fiche.cout ? "disabled" : ""}>${fiche.cout}M</button>`, `'boutique:${i}'`)
          : `<div class="carte vide">— vendu —</div>`
      ).join("");
      el("btn-refresh").disabled = or < COUT_REFRESH;
      el("nb-titulaires").textContent = terrain.length;
      el("terrain").innerHTML = terrain.length
        ? terrain.map((fiche, i) => carteHTML(fiche,
            `<button onclick="basculer(terrain, ${i})">Banc</button><button class="vente" onclick="vendre(terrain, ${i})">Vendre</button>`, `'terrain:${i}'`)).join("")
        : `<div class="carte vide">Achète des joueurs dans la boutique 👆</div>`;
      el("banc").innerHTML = banc.length
        ? banc.map((fiche, i) => carteHTML(fiche,
            `<button onclick="basculer(banc, ${i})">Titulariser</button><button class="vente" onclick="vendre(banc, ${i})">Vendre</button>`, `'banc:${i}'`)).join("")
        : `<div class="carte vide">Personne sur le banc</div>`;
      // Synergies des titulaires, en direct
      const apercu = ONZE.equipeDepuisFiches("Mon Club", "Toi", terrain);
      el("synergies-club").innerHTML = apercu.synergies.length
        ? ONZE_UI.badges(apercu)
        : `<span style="color:#5F7A64;font-size:0.72rem">Les synergies s'activent à 2 joueurs de la même École ou du même archétype.</span>`;
      const axes = ONZE.adnClub(apercu);
      const valeursAxes = Object.values(axes);
      const maxAxe = Math.max(...valeursAxes), minAxe = Math.min(...valeursAxes);
      el("axes-adn").innerHTML = Object.entries(axes).map(([axe, valeur]) => {
        const classe = valeur === maxAxe && maxAxe > minAxe ? "forte" : valeur === minAxe && maxAxe > minAxe ? "faible" : "";
        return `<div class="axe"><span class="nom-axe">${axe}</span>` +
          `<span class="barre-axe"><div class="${classe}" style="width:${valeur}%"></div></span>` +
          `<span class="valeur-axe">${valeur}</span></div>`;
      }).join("");
      // Bouton match
      const verdict = verdictFormation();
      el("btn-match").disabled = !!verdict;
      const sansGardien = !verdict && terrain.filter((j) => j.poste === "GAR").length === 0;
      el("btn-match").textContent = verdict ? "⚽ " + verdict
        : sansGardien ? "😱 Jouer SANS gardien !" : "⚽ Jouer le match !";
    }

    /* ---- Le match : ton équipe contre un adversaire de test ---- */
    const ADVERSAIRES = [
      { nom: "La Masia Rebelle", coach: "Coach Fantôme", noms: ["Rubén", "Unai", "Xabi", "Andoni", "Aitor"] },
      { nom: "Fortezza Nero", coach: "Coach Fantôme", noms: ["Gianluca", "Aurelio", "Mattia", "Tommaso", "Federico"] },
      { nom: "Union Bitume", coach: "Coach Fantôme", noms: ["Bakary", "Nino", "Ratko", "Brahim", "Rodrigo"] },
    ];
    function jouerMatch() {
      const monEquipe = ONZE.equipeDepuisFiches("Mon Club", "Toi", terrain);
      const compo = hasardParmi(ADVERSAIRES);
      const adversaire = ONZE.creerEquipe(compo.nom, compo.coach, compo.noms, tousLesJoueurs);
      el("ecran-mercato").classList.add("masque");
      el("ecran-match").classList.remove("masque");
      el("btn-retour").classList.add("masque");
      el("nom-a").innerHTML = `${monEquipe.nom}<small>Toi</small>`;
      el("nom-b").innerHTML = `${adversaire.nom}<small>${compo.coach}</small>`;
      window.scrollTo({ top: 0 });
      const resultat = ONZE.simulerMatch(monEquipe, adversaire);
      ONZE_UI.rejouer(resultat, monEquipe, adversaire, {
        chrono: el("chrono"), scoreA: el("score-a"), scoreB: el("score-b"), recit: el("recit"),
      }, () => el("btn-retour").classList.remove("masque"));
    }
    function retourMercato() {
      el("ecran-match").classList.add("masque");
      el("ecran-mercato").classList.remove("masque");
      window.scrollTo({ top: 0 });
      afficher();
    }

    /* ---- Mise en place ---- */
    fetch("design/joueurs.json")
      .then((rep) => rep.json())
      .then((donnees) => {
        tousLesJoueurs = donnees;
        construirePool();
        nouvelleBoutique();
        el("odds-info").textContent = "niveau " + NIVEAU_CLUB + " : " +
          Object.entries(ODDS).filter(([, v]) => v > 0).map(([c, v]) => v + "% coût " + c).join(" · ");
        el("btn-match").addEventListener("click", jouerMatch);
        el("btn-retour").addEventListener("click", retourMercato);
        el("btn-vitesse").addEventListener("click", () => {
          const v = ONZE_UI.basculerVitesse();
          el("btn-vitesse").textContent = v === 2 ? "▶️ Vitesse normale" : "⏩ Accélérer ×2";
        });
        el("btn-refresh").addEventListener("click", refresh);
        afficher();
      })
      .catch((e) => {
        el("btn-match").textContent = "Erreur de chargement des joueurs";
        console.error(e);
      });
  </script>

</body>
</html>
