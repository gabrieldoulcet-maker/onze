<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONZE</title>
  <link rel="icon" href="icons/icone-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ONZE">
  <meta name="theme-color" content="#0A160D">
  <link rel="apple-touch-icon" href="icons/icone-180.png">
  <link rel="stylesheet" href="onze.css">
  <style>
    /* ---- LA HOME (DA S2) : le tunnel des joueurs ----
       Le décor est une photo : le logo vit dans la nuit du haut, le menu
       dans l'ombre du tunnel en bas, et le stade respire entre les deux. */
    body {
      justify-content: flex-start; gap: 8px; background: var(--nuit-profonde);
      min-height: 100dvh; padding: 14px 12px 20px;
    }
    header { margin-bottom: auto; }   /* le menu descend au ras du tunnel */
    .fond-accueil {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center 42%;
      z-index: -2; pointer-events: none;
    }
    /* le voile de lisibilité : sombre en haut et en bas, transparent au
       milieu pour laisser voir la pelouse et les projecteurs */
    .voile-accueil {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: linear-gradient(180deg,
        rgba(6, 13, 8, 0.88) 0%, rgba(6, 13, 8, 0.42) 24%, rgba(6, 13, 8, 0.10) 44%,
        rgba(6, 13, 8, 0.55) 70%, rgba(6, 13, 8, 0.93) 100%);
    }
    /* Le logo ARCADE (DA S1, Lot 1 · 1b) : le badge de borne — cartouche
       vert électrique, ONZE penché, O-ballon, traits de vitesse. */
    .cartouche-logo {
      position: relative; display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
      transform: skewX(-8deg) rotate(-2deg);
      background: linear-gradient(180deg, #14351D, #0A1B10);
      border: 4px solid var(--gazon-electrique); border-radius: 20px;
      padding: 14px 30px;
      box-shadow: 0 0 0 4px var(--nuit-profonde), 0 0 34px rgba(61, 226, 107, 0.45), inset 0 -8px 0 rgba(0, 0, 0, 0.4);
    }
    .cartouche-logo .nom-logo {
      font-family: var(--police-display); font-weight: 400; font-size: 2.6rem; line-height: 1;
      color: var(--gazon-electrique); text-shadow: 0 4px 0 #04240E, 0 0 24px rgba(61, 226, 107, 0.6);
    }
    .cartouche-logo .filet { display: flex; align-items: center; gap: 7px; }
    .cartouche-logo .filet i { display: block; width: 34px; height: 3px; background: var(--or-trophee); border-radius: 999px; }
    header .devise { font-family: var(--police-texte); font-weight: 800; font-size: 0.7rem;
      letter-spacing: 4px; color: var(--or-trophee); margin-top: 10px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9); }
    .trait-vitesse { position: fixed; height: 12px; border-radius: 999px; transform: skewX(-30deg);
      pointer-events: none; opacity: 0.4; mix-blend-mode: screen; }
    .menu { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 8px; }
    .bouton-jouer {
      display: block; text-decoration: none; text-align: center;
      background: var(--gazon-electrique); color: #04240E;
      border-radius: 14px; padding: 16px; font-size: 1.2rem; font-weight: 800;
      box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.25), 0 0 26px rgba(61, 226, 107, 0.4);
    }
    .reglages { display: flex; gap: 6px; }
    .reglages button {
      flex: 1; background: rgba(14, 31, 18, 0.92); color: var(--craie-claire); border: 1px solid var(--ligne-forte);
      border-radius: 9px; padding: 8px 3px; font-size: 0.62rem; font-weight: 700; cursor: pointer;
      white-space: nowrap;
      backdrop-filter: blur(3px);
    }
    .palmares {
      background: rgba(14, 31, 18, 0.92); border: 1px solid var(--ligne-forte); border-radius: 12px;
      padding: 10px 12px; font-size: 0.74rem; color: #C9D6C9; backdrop-filter: blur(3px);
    }
    .palmares .ligne { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--ligne); }
    .palmares .ligne > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .palmares .ligne > span:first-child { flex: 0 0 auto; }
    .palmares .ligne:last-child { border-bottom: none; }
    .palmares .place-1 { color: var(--or-trophee); font-weight: 800; }
    .palmares .place-top4 { color: var(--gazon-electrique); }
    /* EN PAYSAGE, chaque bloc va dans la zone que le décor lui laisse
       (luminances relevées sur l'image) :
         · le logo EN HAUT AU CENTRE — la nuit du tunnel y est quasi noire
         · les boutons EN BAS À GAUCHE, autour du tableau tactique
         · le palmarès dans le TIERS DROIT, au-dessus du ballon
       Le ballon (à droite) et le tableau tactique (à gauche) sont les deux
       points d'accroche de l'image : rien ne les recouvre. Et surtout rien
       au bas du centre — c'est la pelouse éclairée, la seule zone claire. */
    @media (orientation: landscape) {
      body { display: block; padding: 0; }
      header {
        position: absolute; top: 3%; left: 50%; transform: translateX(-50%);
        margin: 0; text-align: center;
      }
      .cartouche-logo { padding: 10px 24px; }
      .cartouche-logo .nom-logo { font-size: 2rem; }
      header .devise { margin-top: 6px; font-size: 0.62rem; letter-spacing: 3px; }
      .menu {
        position: absolute; left: 3.5%; bottom: 5%;
        width: min(31%, 290px); max-width: none; gap: 6px;
      }
      .palmares {
        position: absolute; right: 3%; top: 21%;
        width: min(29%, 268px); max-height: 46%; overflow: hidden;
      }
      .voile-accueil {
        background:
          linear-gradient(180deg, rgba(6, 13, 8, 0.80) 0%, rgba(6, 13, 8, 0.22) 22%, rgba(6, 13, 8, 0) 40%),
          linear-gradient(90deg, rgba(6, 13, 8, 0.78) 0%, rgba(6, 13, 8, 0.18) 30%,
            rgba(6, 13, 8, 0) 45%, rgba(6, 13, 8, 0) 58%, rgba(6, 13, 8, 0.22) 74%, rgba(6, 13, 8, 0.78) 100%);
      }
      /* l'invite d'installation, elle, doit passer par le bas du centre :
         elle emporte donc sa propre plaque sombre */
      .invite-a2hs {
        position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%);
        width: min(42%, 380px); margin: 0 !important;
      }
    }
    /* en PORTRAIT l'image se recadre fort : on descend le cadrage pour
       garder la pelouse éclairée dans le champ */
    @media (orientation: portrait) {
      .fond-accueil { object-position: center 58%; }
    }
    .labo { text-align: center; margin-top: 4px; }
    .labo a { color: var(--craie-sourde); font-size: 0.66rem; text-decoration: none;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95); }
  </style>
</head>
<body>
  <img class="fond-accueil" alt="" decoding="async"
    src="da/accueil/jeu/tunnel.webp"
    srcset="da/accueil/jeu/tunnel.webp 1x, da/accueil/hd/tunnel.webp 2x">
  <div class="voile-accueil"></div>
  <div class="trait-vitesse" style="left:-40px; top:22%; width:280px; background:linear-gradient(90deg, rgba(61,226,107,0), #3DE26B); opacity:0.55"></div>
  <div class="trait-vitesse" style="left:-40px; top:calc(22% + 22px); width:190px; height:8px; background:linear-gradient(90deg, rgba(61,226,107,0), #3DE26B); opacity:0.35"></div>
  <div class="trait-vitesse" style="right:-40px; top:64%; width:280px; background:linear-gradient(270deg, rgba(242,193,78,0), #F2C14E); opacity:0.45"></div>
  <div class="trait-vitesse" style="right:-40px; top:calc(64% + 22px); width:180px; height:8px; background:linear-gradient(270deg, rgba(242,193,78,0), #F2C14E); opacity:0.3"></div>
  <header>
    <div class="cartouche-logo">
      <span class="nom-logo">ONZE</span>
      <span class="filet"><i></i><svg width="24" height="24" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#FDF8EA" stroke="#04240E" stroke-width="6"></circle><polygon points="32,21 42,28.5 38,40.5 26,40.5 22,28.5" fill="#04240E"></polygon></svg><i></i></span>
    </div>
    <p class="devise">HUIT COACHS · UN MERCATO</p>
  </header>
  <div class="menu">
    <a class="bouton-jouer" href="partie.html"><svg class="ic-sys" width="18" height="18" viewBox="0 0 48 48"><use href="#is-trophee"></use></svg> Jouer</a>
    <div class="reglages">
      <button id="btn-difficulte" style="color:var(--or-trophee);border-color:var(--or-trophee)"></button>
      <button id="btn-sons"></button>
      <button id="btn-detente"></button>
      <button id="btn-reset" style="color:var(--alerte-claire);border-color:var(--vendre-fond)"><svg class="ic-sys" width="12" height="12" viewBox="0 0 48 48"><use href="#is-balai"></use></svg> Réinitialiser</button>
    </div>
    <div class="labo"><a href="draft.html"><svg class="ic-sys" width="11" height="11" viewBox="0 0 48 48"><use href="#is-fiole"></use></svg> labo</a> · <a href="match.html" style="color:#5F7A64">match de démo</a></div>
  </div>
  <div class="palmares" id="palmares" style="display:none"></div>
  <script src="icones-systeme.js"></script>
  <script>
    /* Les réglages écrivent les mêmes clés que le jeu */
    ONZE_ICONES_SYS.injecter();
    const ic = ONZE_ICONES_SYS.ic;
    const DIFFICULTES = { amateur: ic("etoile", 11) + " Amateur", pro: ic("etoile", 11) + ic("etoile", 11) + " Pro", legende: ic("couronne", 12) + " Légende" };
    const majBoutons = () => {
      let sons = true, detente = false, difficulte = "pro";
      try {
        sons = localStorage.getItem("onze-sons") !== "off";
        detente = localStorage.getItem("onze-mode-detente") === "1";
        difficulte = localStorage.getItem("onze-difficulte") || "pro";
      } catch (e) {}
      document.getElementById("btn-sons").innerHTML = sons ? ic("hp", 12) + " Sons : oui" : ic("hp-mute", 12) + " Sons : non";
      document.getElementById("btn-detente").innerHTML = detente ? ic("chrono-barre", 12) + " Sans chrono" : ic("chrono", 12) + " Chrono : oui";
      document.getElementById("btn-difficulte").innerHTML = DIFFICULTES[difficulte] || DIFFICULTES.pro;
    };
    document.getElementById("btn-difficulte").addEventListener("click", () => {
      const ordre = ["amateur", "pro", "legende"];
      let d = "pro";
      try { d = localStorage.getItem("onze-difficulte") || "pro"; } catch (e) {}
      const suivante = ordre[(ordre.indexOf(d) + 1) % ordre.length];
      try { localStorage.setItem("onze-difficulte", suivante); } catch (e) {}
      majBoutons();
    });
    document.getElementById("btn-sons").addEventListener("click", () => {
      try { localStorage.setItem("onze-sons", localStorage.getItem("onze-sons") === "off" ? "on" : "off"); } catch (e) {}
      majBoutons();
    });
    document.getElementById("btn-detente").addEventListener("click", () => {
      try { localStorage.setItem("onze-mode-detente", localStorage.getItem("onze-mode-detente") === "1" ? "0" : "1"); } catch (e) {}
      majBoutons();
    });
    document.getElementById("btn-reset").addEventListener("click", () => {
      if (!confirm("Effacer la partie en cours et repartir de zéro ? (le palmarès est conservé)")) return;
      try {
        const palmares = localStorage.getItem("onze-palmares");
        localStorage.clear();
        if (palmares) localStorage.setItem("onze-palmares", palmares);
      } catch (e) {}
      alert("Jeu réinitialisé.");
      majBoutons();
    });
    majBoutons();

    /* Le palmarès local : la mémoire du joueur */
    try {
      const palmares = JSON.parse(localStorage.getItem("onze-palmares") || "[]");
      if (palmares.length) {
        const bloc = document.getElementById("palmares");
        bloc.style.display = "block";
        bloc.innerHTML = `<strong>${ic("parchemin", 12)} Ton palmarès</strong>` + palmares.slice(0, 3).map((p) =>
          `<div class="ligne"><span class="${p.place === 1 ? "place-1" : p.place <= 4 ? "place-top4" : ""}">${p.place === 1 ? ic("trophee", 11) + " Champion" : p.place + "ᵉ"} · M${p.manche}</span>` +
          `<span style="color:var(--craie-sourde)">${(p.compo || []).slice(0, 2).join(", ")}${p.icones && p.icones.length ? " · " + ic("cible", 10) + p.icones.length : ""}</span>` +
          `<span style="color:#5F7A64">${p.date || ""}</span></div>`).join("");
      }
    } catch (e) {}

    /* L'invite « Ajouter à l'écran d'accueil » : sur l'ACCUEIL uniquement,
       une apparition par session, un tap pour fermer. Rien en mode installé. */
    (function () {
      try {
        const standalone = window.matchMedia("(display-mode: fullscreen)").matches ||
          window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
        if (standalone || sessionStorage.getItem("onze-invite-a2hs")) return;
        sessionStorage.setItem("onze-invite-a2hs", "1");
        const invite = document.createElement("div");
        invite.className = "invite-a2hs";
        invite.style.cssText = "margin-top:10px;max-width:400px;background:rgba(14,31,18,0.94);border:1px solid var(--gazon-electrique);" +
          "border-radius:12px;padding:9px 13px;font-size:0.74rem;color:#C9D6C9;cursor:pointer;text-align:center;" +
          "backdrop-filter:blur(4px);box-shadow:0 8px 24px rgba(0,0,0,0.6)";
        invite.innerHTML = `📲 <strong>Installe ONZE !</strong><br><small style="color:var(--craie-sourde)">« Ajouter à l'écran d'accueil » dans le menu du navigateur : plein écran sans barre, icône d'app — et l'orientation paysage se verrouille sur Android. Touche pour fermer.</small>`;
        invite.addEventListener("click", () => invite.remove());
        document.body.appendChild(invite);
      } catch (e) {}
    })();
  </script>
</body>
</html>
