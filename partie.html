<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ONZE — La Partie</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>⚽</text></svg>">
  <link rel="stylesheet" href="onze.css">
  <style>
    /* ============================================================
       Copie de l'interface TFT mobile (décision n°19, en PAYSAGE) :
       - synergies en colonne à GAUCHE
       - plateau (terrain) au CENTRE, banc juste dessous
       - classement des 8 coachs toujours visible à DROITE
       - boutique en barre du BAS : or/XP/refresh à gauche des 5 cartes
       Le match se joue sur le terrain, le tiroir reste ouvert.
       ============================================================ */
    html, body { height: 100%; }
    body { padding: 0; display: flex; flex-direction: column; overflow: hidden; }

    /* ---- C'est une app : le jeu est TOUJOURS horizontal. En attendant
       le verrouillage natif (Capacitor), on tourne l'interface nous-mêmes
       quand le téléphone est tenu en portrait. ---- */
    #app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; background: #101711; }
    @media (orientation: portrait) {
      #app {
        position: absolute; top: 0; left: 0;
        width: 100vh; height: 100vw;
        transform: rotate(90deg) translateY(-100%);
        transform-origin: top left;
      }
    }
    /* Les panneaux se posent DANS #app pour tourner avec lui */
    .volet, .voile-fiche, .fusion-banniere, .message-flottant { position: absolute; }

    /* ---- Barre du haut : manche + annonce + vitesses ---- */
    .haut {
      flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 4px 10px; background: #0B100C; border-bottom: 1px solid #24331F;
      font-size: 0.72rem; color: #96A699;
    }
    .haut .manche-info { cursor: pointer; white-space: nowrap; }
    .haut .annonce { flex: 1; text-align: center; color: #C9D6C9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .haut button {
      background: #182219; color: #A9DDB6; border: 1px solid #24331F;
      border-radius: 7px; padding: 3px 8px; font-size: 0.68rem; font-weight: 700; cursor: pointer;
    }

    /* ---- Le centre : synergies | plateau | classement ---- */
    .centre { flex: 1 1 auto; display: flex; min-height: 0; }
    .col-synergies {
      flex: 0 0 112px; overflow-y: auto; padding: 6px 4px 6px 8px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .col-synergies .badge { display: block; text-align: left; font-size: 0.6rem; padding: 3px 5px; }
    .col-synergies .mini-adn { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
    .mini-adn .axe-mini { font-size: 0.54rem; color: #96A699; }
    .mini-adn .barre-mini { height: 4px; background: #182219; border-radius: 2px; overflow: hidden; margin-top: 1px; }
    .mini-adn .barre-mini > div { height: 100%; background: #5F7A64; }
    .mini-adn .barre-mini > div.forte { background: #4FC57C; }
    .mini-adn .barre-mini > div.faible { background: #E88C7D; }

    .plateau { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; padding: 4px 2px; }
    .terrain {
      flex: 1; position: relative; min-height: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05) 0 8%, transparent 8.5%),
        repeating-linear-gradient(90deg, #1C5A2C 0 12.5%, #1F6330 12.5% 25%),
        #1C5A2C;
      border: 2px solid rgba(255,255,255,0.35); border-radius: 10px;
      display: flex; justify-content: space-between; padding: 4px 8px; overflow: hidden;
    }
    .terrain::before { /* ligne médiane verticale */
      content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
      border-left: 2px solid rgba(255,255,255,0.3);
    }
    .ligne-terrain {
      display: flex; flex-direction: column; justify-content: center; gap: 4px;
      min-width: 58px; z-index: 1;
    }
    .jeton {
      width: 60px; border-radius: 8px; padding: 2px;
      background: #182219E6; border: 1px solid #35502F;
      text-align: center; cursor: pointer; font-size: 0.56rem; color: #C9D6C9; line-height: 1.2;
    }
    .jeton .note-jeton { font-weight: 800; font-size: 0.72rem; color: #E7EEE7; }
    .jeton .etoiles { font-size: 0.56rem; }
    .jeton.vide { border-style: dashed; color: #ffffff66; background: #0b100c55; min-height: 30px;
      display: flex; align-items: center; justify-content: center; }
    .jeton.cout-1 { border-left: 3px solid #8B9E8E; } .jeton.cout-2 { border-left: 3px solid #4FC57C; }
    .jeton.cout-3 { border-left: 3px solid #4F9EC5; } .jeton.cout-4 { border-left: 3px solid #A66BD4; }
    .jeton.cout-5 { border-left: 3px solid #E8C547; } .jeton.cout-0 { border-left: 3px solid #5A6A5C; }
    .rangee-banc {
      flex: 0 0 auto; display: flex; gap: 4px; overflow-x: auto;
      padding: 4px 2px 0; min-height: 40px;
    }
    .rangee-banc .jeton { flex: 0 0 56px; }

    .col-classement {
      flex: 0 0 128px; display: flex; flex-direction: column;
      padding: 6px 8px 6px 4px; gap: 2px; overflow-y: auto;
    }
    .col-classement .coach-ligne {
      background: #182219; border: 1px solid #24331F; border-radius: 7px;
      padding: 3px 6px; font-size: 0.6rem; cursor: pointer; color: #C9D6C9;
    }
    .col-classement .coach-ligne.moi { color: #4FC57C; font-weight: 700; border-color: #35502F; }
    .col-classement .coach-ligne.mort { color: #5A6A5C; text-decoration: line-through; }
    .col-classement .barre-prestige { height: 4px; background: #0B100C; border-radius: 2px; overflow: hidden; margin-top: 2px; }
    .col-classement .barre-prestige > div { height: 100%; background: #4FC57C; }
    .col-classement .principal {
      margin: auto 0 0; padding: 10px 4px; font-size: 0.78rem; width: 100%;
    }

    /* ---- Pendant le match : tableau + journal sur le terrain ---- */
    .tableau-match {
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      background: #0B100CE8; border: 1px solid #24331F; border-radius: 9px;
      padding: 3px 12px; z-index: 5; text-align: center; font-size: 0.64rem;
      color: #96A699; white-space: nowrap;
    }
    .tableau-match .score-match { font-size: 0.95rem; font-weight: 800; color: #E7EEE7; }
    .journal {
      position: absolute; left: 6px; right: 6px; bottom: 4px; max-height: 52%;
      overflow-y: auto; z-index: 5; display: flex; flex-direction: column; gap: 3px;
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%);
              mask-image: linear-gradient(to bottom, transparent, black 15%);
    }
    .journal .phase { padding: 4px 8px; font-size: 0.68rem; line-height: 1.3; background: #182219F0; }
    .journal .titre-phase { font-size: 0.56rem; margin-bottom: 0; }
    .journal .cri { font-size: 0.74rem; }
    .journal:empty { display: none; }

    /* ---- La barre boutique du bas (copie TFT) ---- */
    .boutique-barre {
      flex: 0 0 auto; display: flex; gap: 6px; align-items: stretch;
      background: #0B100C; border-top: 1px solid #24331F;
      padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
    }
    .bloc-eco {
      flex: 0 0 96px; display: flex; flex-direction: column; gap: 3px;
    }
    .bloc-eco .or-affiche { text-align: center; color: #E8C547; font-weight: 800; font-size: 0.9rem; }
    .bloc-eco button {
      flex: 1; background: #182219; color: #A9DDB6; border: 1px solid #24331F;
      border-radius: 7px; font-size: 0.6rem; font-weight: 700; cursor: pointer; padding: 3px;
      line-height: 1.25;
    }
    .bloc-eco button:disabled { color: #5A6A5C; }
    .rangee-boutique { flex: 1; display: flex; gap: 5px; overflow-x: auto; }
    .carte-boutique {
      flex: 1 0 96px; background: #182219; border: 1px solid #24331F; border-radius: 9px;
      padding: 4px 5px; font-size: 0.56rem; color: #C9D6C9; cursor: pointer; line-height: 1.25;
      display: flex; flex-direction: column; gap: 1px;
    }
    .carte-boutique .haut-carte { display: flex; justify-content: space-between; font-weight: 800; font-size: 0.64rem; color: #E7EEE7; }
    .carte-boutique .prix { color: #E8C547; }
    .carte-boutique .signatures { color: #9CC4EF; font-weight: 700; }
    .carte-boutique .traits-carte { color: #7E9483; font-size: 0.52rem; }
    .carte-boutique button {
      margin-top: auto; background: #4FC57C; color: #0B100C; border: none;
      border-radius: 6px; padding: 3px; font-weight: 800; font-size: 0.62rem; cursor: pointer;
    }
    .carte-boutique button:disabled { background: #2A3A2C; color: #6C7A6E; }
    .carte-boutique.vendue { opacity: 0.35; justify-content: center; text-align: center; }
    .carte-boutique.cout-1 { border-top: 3px solid #8B9E8E; } .carte-boutique.cout-2 { border-top: 3px solid #4FC57C; }
    .carte-boutique.cout-3 { border-top: 3px solid #4F9EC5; } .carte-boutique.cout-4 { border-top: 3px solid #A66BD4; }
    .carte-boutique.cout-5 { border-top: 3px solid #E8C547; }
    .btn-verrou-carte { flex: 0 0 30px; background: #182219; color: #A9DDB6; border: 1px solid #24331F;
      border-radius: 7px; font-size: 0.85rem; cursor: pointer; }

    .message-flottant {
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
      color: #E88C7D; font-size: 0.75rem; z-index: 90; background: #0B100CDD;
      border-radius: 8px; padding: 0 8px; pointer-events: none; text-align: center;
    }

    /* ---- Volets et panneaux ---- */
    .volet {
      position: fixed; inset: 0; background: rgba(6, 10, 7, 0.88);
      z-index: 60; display: flex; align-items: center; justify-content: center;
      padding: 14px; overflow-y: auto;
    }
    .volet .panneau {
      background: #131b14; border: 1px solid #35502F; border-radius: 14px;
      width: 100%; max-width: 420px; max-height: 92vh; overflow-y: auto;
      padding: 14px; animation: apparait 0.25s ease; font-size: 0.8rem;
    }
    .volet .panneau .classement { border: none; padding: 0; margin: 0 0 8px; background: none; }
    .volet .fermer-volet {
      width: 100%; margin-top: 10px; background: #24331F; color: #A9DDB6;
      border: none; border-radius: 10px; padding: 9px; font-weight: 700; cursor: pointer;
    }
    .orbes { margin: 8px 0 2px; }
    .orbe { width: 64px; height: 64px; font-size: 1.5rem; }
  </style>
</head>
<body>
  <div id="app">

  <!-- ===== Barre du haut ===== -->
  <div class="haut">
    <span class="manche-info" id="btn-historique">📜 M<span id="manche">1</span> ·
      💚 <span id="prestige">40</span> · Niv <span id="niveau">3</span> ·
      XP <span id="xp">0</span>/<span id="xp-suivant">6</span> ·
      <span id="serie">—</span> · 🧰 <span id="staff">0</span></span>
    <span class="annonce" id="annonce"></span>
    <button id="btn-vitesse" class="masque">⏩ ×2</button>
  </div>

  <!-- ===== Centre : synergies | plateau + banc | classement ===== -->
  <div class="centre">
    <div class="col-synergies">
      <div id="synergies-club"></div>
      <div class="mini-adn" id="axes-adn"></div>
      <div id="inventaire-staff" style="margin-top:6px;display:flex;flex-direction:column;gap:3px"></div>
    </div>
    <div class="plateau">
      <div class="terrain" id="terrain-scene">
        <div class="ligne-terrain" id="ligne-GAR"></div>
        <div class="ligne-terrain" id="ligne-DÉF"></div>
        <div class="ligne-terrain" id="ligne-MIL"></div>
        <div class="ligne-terrain" id="ligne-ATT"></div>
        <div class="tableau-match masque" id="tableau-match">
          <span id="nom-adversaire-match"></span>
          <span class="score-match"> <span id="score-a">0</span> – <span id="score-b">0</span> </span>
          <span id="chrono"></span>
        </div>
        <div class="journal" id="recit"></div>
      </div>
      <div class="rangee-banc" id="banc"></div>
    </div>
    <div class="col-classement" id="col-classement">
      <div id="classement-liste"></div>
      <button class="principal" id="btn-match">⚽</button>
    </div>
  </div>

  <!-- ===== Barre boutique du bas (copie TFT) ===== -->
  <div class="boutique-barre">
    <div class="bloc-eco">
      <div class="or-affiche"><span id="or">0</span>M 🪙</div>
      <button id="btn-xp">📈 Acheter XP<br>4M → +4</button>
      <button id="btn-refresh">🔄 Actualiser<br>2M</button>
    </div>
    <div class="rangee-boutique" id="boutique"></div>
    <button class="btn-verrou-carte" id="btn-verrou">🔓</button>
  </div>

  <div class="message-flottant" id="message"></div>

  </div><!-- /app -->

  <script src="match-moteur.js"></script>
  <script src="match-ui.js"></script>
  <script>
    /* ============================================================
       Logique de partie : économie TFT (design/economie.md),
       calibrage simulations/parties.js. L'INTERFACE est l'écran
       unique de la décision n°19 : pendant le match, la boutique
       et le banc restent utilisables (achats → banc), les
       changements de compo prennent effet à la manche suivante.
       ============================================================ */
    const OR_DEPART = 0;
    const COUT_REFRESH = 2;
    const COUT_XP = 4;
    const XP_GRATUITE_PAR_MANCHE = 2;
    const TAILLE_BOUTIQUE = 5;
    const TAILLE_BANC = 9;
    const PRESTIGE_DEPART = 40; // calibré en simulation
    const DERNIERE_MANCHE_AMICALE = 3;
    const POOL_PAR_COUT = { 1: 30, 2: 25, 3: 18, 4: 10, 5: 9 };
    const droitsTV = (manche) => [2, 2, 3, 4][manche - 1] ?? 5;
    const XP_POUR_MONTER = { 3: 6, 4: 10, 5: 20, 6: 36, 7: 60, 8: 68, 9: 68 };
    const TITULAIRES_PAR_NIVEAU = { 3: 5, 4: 6, 5: 7, 6: 8, 7: 9, 8: 10, 9: 11, 10: 11 };
    const ODDS_PAR_NIVEAU = {
      3: [75, 25, 0, 0, 0], 4: [55, 30, 15, 0, 0], 5: [45, 33, 20, 2, 0],
      6: [30, 40, 25, 5, 0], 7: [19, 30, 40, 10, 1], 8: [18, 25, 32, 22, 3],
      9: [10, 20, 25, 35, 10], 10: [5, 10, 20, 40, 25],
    };
    const MEMBRES_STAFF = ["Prépa physique", "Coach mental", "Analyste vidéo", "Coach de finition",
      "Coach technique", "Kiné", "Adjoint tactique", "Scout"];
    // Le Passeport est rare (l'équivalent de la Spatule)
    const tirerCarteStaff = () => Math.random() < 0.1 ? "Passeport" : hasardParmi(MEMBRES_STAFF);
    const STARTERS = [
      { nom: "Gus",    cout: 0, poste: "GAR", ecole: "", archetype: "", unique: null },
      { nom: "Marcel", cout: 0, poste: "DÉF", ecole: "", archetype: "", unique: null },
      { nom: "Rachid", cout: 0, poste: "DÉF", ecole: "", archetype: "", unique: null },
      { nom: "Momo",   cout: 0, poste: "MIL", ecole: "", archetype: "", unique: null },
      { nom: "Titi",   cout: 0, poste: "ATT", ecole: "", archetype: "", unique: null },
    ];
    const COACHS_IA = [
      { nom: "Fortezza Nero", ecole: "Catenaccio" },
      { nom: "La Masia Rebelle", ecole: "Tiki-Taka" },
      { nom: "Union Bitume", ecole: "École de la Rue" },
      { nom: "Royal Toundra", ecole: "Kick & Rush" },
      { nom: "Clockwork XI", ecole: "Football Total" },
      { nom: "Barrio Bravo", ecole: "La Grinta" },
      { nom: "Le Consortium", ecole: "Les Pros" },
    ];
    const AMICAUX = [
      { nom: "Espoirs Régionaux", taille: 4 },
      { nom: "AS Vétérans", taille: 5 },
      { nom: "Sélection du District", taille: 5, relevee: true },
    ];

    /* Les Philosophies de club (les augments de TFT) : un choix parmi 3
       aux manches 4, 7 et 10 — effets définitifs jusqu'à la fin. */
    const MANCHES_PHILOSOPHIE = [4, 7, 10];
    const PHILOSOPHIES = [
      { nom: "Droits TV majorés", emoji: "📺", desc: "+1M de revenu de base à chaque manche." },
      { nom: "Mécènes", emoji: "🏦", desc: "Tes sponsors suivent jusqu'à +7M d'intérêts (au lieu de 5)." },
      { nom: "Centre de formation", emoji: "🎓", desc: "+1 XP gratuit supplémentaire par manche." },
      { nom: "Guichets fermés", emoji: "🎟️", desc: "La prime de victoire passe à +2M." },
      { nom: "Trésor de guerre", emoji: "💰", desc: "+10M immédiatement." },
      { nom: "Académie des jeunes", emoji: "🐣", desc: "Un joueur coût 1 gratuit rejoint ton banc chaque manche." },
      { nom: "Organigramme étoffé", emoji: "🧰", desc: "Une carte staff maintenant, une autre dans 3 manches." },
      { nom: "Réseau de recruteurs", emoji: "🔭", desc: "Le mercato propose 6 joueurs au lieu de 5." },
      { nom: "Préparation physique", emoji: "🏃", desc: "+5 Endurance pour toute l'équipe." },
      { nom: "Culture de la gagne", emoji: "🔥", desc: "+5 Mental pour toute l'équipe." },
      { nom: "Forteresse", emoji: "🧱", desc: "+4 Tacle et +4 Placement pour toute l'équipe." },
      { nom: "Jeu de possession", emoji: "🎯", desc: "+4 Passe et +4 Technique pour toute l'équipe." },
      { nom: "Direction patiente", emoji: "🩹", desc: "+10 prestige immédiatement (plafonné au départ)." },
    ];
    const aPhilosophie = (nom) => partie.philosophies.includes(nom);
    const BOOSTS_PHILOSOPHIES = {
      "Préparation physique": { endurance: 5 },
      "Culture de la gagne": { mental: 5 },
      "Forteresse": { tacle: 4, placement: 4 },
      "Jeu de possession": { passe: 4, technique: 4 },
    };

    const el = (id) => document.getElementById(id);
    const hasardParmi = (t) => t[Math.floor(Math.random() * t.length)];
    const de2 = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
    let tousLesJoueurs = [];
    let partie = null;

    /* ================= État ================= */
    function nouvellePartie() {
      const coachs = [{ nom: "Mon Club", ia: false, prestige: PRESTIGE_DEPART, serie: 0, vivant: true }];
      for (const c of COACHS_IA) coachs.push({ ...c, ia: true, prestige: PRESTIGE_DEPART, serie: 0, vivant: true });
      partie = {
        manche: 1, coachs,
        or: OR_DEPART, niveau: 3, xp: 0, staff: [],
        terrain: STARTERS.map((j) => ({ ...j, etoiles: 1 })), banc: [], boutique: [], pool: [],
        butin: { 1: ["gris", "gris"], 2: ["gris", "bleu"], 3: ["or"] },
        orbesEnAttente: [], verrou: false, dernierAdversaire: null,
        appariement: null, historique: [], exempt: null, matchEnCours: false,
        philosophies: [], philosophiesVues: [], staffEnRetard: null, tailleBoutique: TAILLE_BOUTIQUE,
        hiversVus: [],
      };
      construirePool();
      nouvelleBoutique(false);
      preparerManche();
      document.querySelectorAll(".volet").forEach((v) => v.remove());
      afficher();
    }
    const moi = () => partie.coachs[0];

    /* L'équipe alignée, avec les boosts de Philosophies appliqués */
    function equipeDuClub() {
      const equipe = ONZE.equipeDepuisFiches("Mon Club", "Toi", partie.terrain);
      for (const nom of partie.philosophies) {
        const boosts = BOOSTS_PHILOSOPHIES[nom];
        if (!boosts) continue;
        for (const j of equipe.joueurs) {
          for (const [stat, montant] of Object.entries(boosts)) {
            if (!(stat in j.stats)) continue;
            j.boosts[stat] = (j.boosts[stat] || 0) + montant;
            j.stats[stat] = Math.min(99, j.stats[stat] + montant);
          }
          j.note = ONZE.noteGlobale(j.stats);
        }
      }
      return equipe;
    }

    /* ================= Pool et boutique ================= */
    function construirePool() {
      partie.pool = [];
      for (const j of tousLesJoueurs)
        for (let c = 0; c < (POOL_PAR_COUT[j.cout] || 0); c++) partie.pool.push(j);
    }
    function tirerCarte() {
      const odds = ODDS_PAR_NIVEAU[Math.min(partie.niveau, 10)];
      const tirage = Math.random() * 100;
      let cumul = 0, coutChoisi = 1;
      for (let c = 0; c < 5; c++) { cumul += odds[c]; if (tirage < cumul) { coutChoisi = c + 1; break; } }
      let candidats = partie.pool.filter((j) => j.cout === coutChoisi);
      if (candidats.length === 0) candidats = partie.pool;
      return candidats.length ? hasardParmi(candidats) : null;
    }
    function nouvelleBoutique(rendre = true) {
      if (rendre) for (const c of partie.boutique) if (c) partie.pool.push(c);
      partie.boutique = [];
      for (let i = 0; i < partie.tailleBoutique; i++) {
        const carte = tirerCarte();
        if (carte) partie.pool.splice(partie.pool.indexOf(carte), 1);
        partie.boutique.push(carte);
      }
    }

    /* ================= Actions du mercato =================
       Toujours disponibles, MÊME pendant le match (décision n°19) :
       les achats vont alors au banc, la compo ne bouge qu'après. */
    function acheter(indice) {
      const fiche = partie.boutique[indice];
      if (!fiche) return;
      if (partie.or < fiche.cout) return signaler("Pas assez d'or pour " + fiche.nom + ".");
      const max = TITULAIRES_PAR_NIVEAU[partie.niveau];
      if (partie.terrain.length + partie.banc.length >= max + TAILLE_BANC)
        return signaler("Effectif complet — vends quelqu'un.");
      if (partie.matchEnCours && partie.banc.length >= TAILLE_BANC)
        return signaler("Banc plein — pendant le match, les recrues vont au banc.");
      partie.or -= fiche.cout;
      partie.boutique[indice] = null;
      const copie = { ...fiche, etoiles: 1 };
      if (!partie.matchEnCours && partie.terrain.length < max) partie.terrain.push(copie);
      else partie.banc.push(copie);
      const fusions = ONZE.fusionnerEffectif(partie.terrain, partie.banc);
      if (fusions.length) celebrerFusions(fusions);
      afficher();
    }
    function vendre(nomListe, indice) {
      if (partie.matchEnCours && nomListe === "terrain")
        return signaler("Le match se joue — les titulaires ne se vendent pas en plein match.");
      const liste = partie[nomListe];
      const fiche = liste[indice];
      // le staff du joueur vendu revient à l'inventaire
      for (const carte of fiche.staffCartes || []) partie.staff.push(carte);
      for (const spec of fiche.specialisations || []) partie.staff.push(spec);
      const copies = Math.pow(3, (fiche.etoiles || 1) - 1);
      partie.or += fiche.cout * copies;
      const original = tousLesJoueurs.find((j) => j.nom === fiche.nom);
      if (original) for (let c = 0; c < copies; c++) partie.pool.push(original);
      liste.splice(indice, 1);
      afficher();
    }
    function basculer(nomListe, indice) {
      if (partie.matchEnCours)
        return signaler("⏳ Les changements de compo prendront effet à la manche suivante.");
      const liste = partie[nomListe];
      if (nomListe === "banc" && partie.terrain.length >= TITULAIRES_PAR_NIVEAU[partie.niveau])
        return signaler("Terrain plein — fais descendre quelqu'un.");
      const fiche = liste.splice(indice, 1)[0];
      (nomListe === "banc" ? partie.terrain : partie.banc).push(fiche);
      afficher();
    }
    function refresh() {
      if (partie.or < COUT_REFRESH) return signaler("Pas assez d'or.");
      partie.or -= COUT_REFRESH;
      partie.verrou = false;
      nouvelleBoutique();
      afficher();
    }
    function acheterXP() {
      if (partie.or < COUT_XP) return signaler("Pas assez d'or.");
      partie.or -= COUT_XP;
      gagnerXP(4);
      afficher();
    }
    function gagnerXP(quantite) {
      if (partie.niveau >= 10) return;
      partie.xp += quantite;
      let seuil = XP_POUR_MONTER[partie.niveau];
      while (seuil && partie.xp >= seuil) {
        partie.xp -= seuil;
        partie.niveau++;
        signaler("🎉 Niveau " + partie.niveau + " — " + TITULAIRES_PAR_NIVEAU[partie.niveau] + " titulaires !");
        seuil = XP_POUR_MONTER[partie.niveau];
      }
    }
    function signaler(texte) {
      el("message").textContent = texte;
      setTimeout(() => { if (el("message").textContent === texte) el("message").textContent = ""; }, 3000);
    }
    function verdictFormation() {
      if (partie.terrain.length === 0) return "Achète au moins un joueur !";
      if (partie.terrain.filter((j) => j.poste === "GAR").length > 1) return "Un seul gardien.";
      return null;
    }
    function formationIncomplete() {
      const nb = (p) => partie.terrain.filter((j) => j.poste === p).length;
      return nb("DÉF") < 1 || nb("MIL") < 1 || nb("ATT") < 1 || nb("GAR") < 1;
    }
    function celebrerFusions(fusions) {
      fusions.forEach((f, i) => {
        setTimeout(() => {
          const banniere = document.createElement("div");
          banniere.className = "fusion-banniere";
          banniere.innerHTML = f.etoiles >= 3
            ? `🌟 LÉGENDE DU CLUB ! 🌟<br>${f.nom} atteint les 3 étoiles !<small>Le sommet absolu — niveau maximum</small>`
            : `✨ FUSION ! ✨<br>${f.nom} devient Titulaire 2★<small>Trois copies réunies — les stats grimpent</small>`;
          el("app").appendChild(banniere);
          setTimeout(() => banniere.remove(), 2700);
        }, i * 900);
      });
    }

    /* ================= Butin des amicaux (orbes) ================= */
    function piocherJoueur(coutMax, coutMin = 1) {
      const possedes = new Set([...partie.terrain, ...partie.banc].map((j) => j.nom));
      let candidats = partie.pool.filter((j) => j.cout >= coutMin && j.cout <= coutMax);
      const doublons = candidats.filter((j) => possedes.has(j.nom));
      if (doublons.length && Math.random() < 0.6) candidats = doublons;
      if (!candidats.length) return null;
      const fiche = hasardParmi(candidats);
      partie.pool.splice(partie.pool.indexOf(fiche), 1);
      return fiche;
    }
    function creerOrbe(rarete) {
      const tirage = Math.random();
      if (rarete === "gris") {
        if (tirage < 0.5) return { rarete, type: "or", montant: de2(1, 2) };
        const fiche = piocherJoueur(1);
        return fiche ? { rarete, type: "joueur", fiche } : { rarete, type: "or", montant: 2 };
      }
      if (rarete === "bleu") {
        if (tirage < 0.35) return { rarete, type: "or", montant: de2(2, 3) };
        if (tirage < 0.65) return { rarete, type: "staff", membre: tirerCarteStaff() };
        const fiche = piocherJoueur(2);
        return fiche ? { rarete, type: "joueur", fiche } : { rarete, type: "or", montant: 3 };
      }
      if (tirage < 0.6) { // or : le duo du centre de formation domine
        const possedes = new Set([...partie.terrain, ...partie.banc].map((j) => j.nom));
        let candidats = partie.pool.filter((j) => j.cout === 1 && partie.pool.filter((x) => x.nom === j.nom).length >= 2);
        const doublons = candidats.filter((j) => possedes.has(j.nom));
        if (doublons.length && Math.random() < 0.7) candidats = doublons;
        if (candidats.length) {
          const nom = hasardParmi(candidats).nom;
          const fiche = partie.pool.find((j) => j.nom === nom);
          partie.pool.splice(partie.pool.indexOf(fiche), 1);
          partie.pool.splice(partie.pool.findIndex((j) => j.nom === nom), 1);
          return { rarete, type: "duo", fiche };
        }
      }
      if (tirage < 0.8) return { rarete, type: "staff", membre: tirerCarteStaff(), montantBonus: 2 };
      const fiche = piocherJoueur(3, 2);
      return fiche ? { rarete, type: "joueur", fiche } : { rarete, type: "or", montant: 4 };
    }
    function ouvrirOrbe(bouton, indice) {
      const orbe = partie.orbesEnAttente[indice];
      if (!orbe || orbe.ouvert) return;
      orbe.ouvert = true;
      const revele = document.createElement("div");
      revele.className = "orbe-revele";
      if (orbe.type === "or") {
        partie.or += orbe.montant;
        revele.innerHTML = `🪙 <strong>+${orbe.montant}M</strong><br><small>La billetterie a bien marché.</small>`;
      } else if (orbe.type === "staff") {
        partie.staff.push(orbe.membre);
        if (orbe.montantBonus) partie.or += orbe.montantBonus;
        revele.innerHTML = `🧰 <strong>${orbe.membre}</strong> rejoint le club !` +
          (orbe.montantBonus ? ` <strong>+${orbe.montantBonus}M</strong>` : "") +
          `<br><small>Carte Staff — le système complet arrive bientôt.</small>`;
      } else {
        const nombre = orbe.type === "duo" ? 2 : 1;
        for (let n = 0; n < nombre; n++) {
          const copie = { ...orbe.fiche, etoiles: 1 };
          if (partie.terrain.length < TITULAIRES_PAR_NIVEAU[partie.niveau]) partie.terrain.push(copie);
          else partie.banc.push(copie);
        }
        const fusions = ONZE.fusionnerEffectif(partie.terrain, partie.banc);
        if (fusions.length) celebrerFusions(fusions);
        revele.innerHTML = orbe.type === "duo"
          ? `⚽⚽ <strong>${orbe.fiche.nom} × 2</strong> — le duo du centre de formation !<br><small>Deux copies d'un coup… la fusion se rapproche.</small>`
          : `⚽ <strong>${orbe.fiche.nom}</strong> signe gratuitement !<br><small>${orbe.fiche.ecole || "Sans École"} · ${orbe.fiche.archetype || "sans archétype"} — une orientation à saisir ?</small>`;
      }
      bouton.replaceWith(revele);
      afficher();
      const continuer = document.getElementById("btn-continuer");
      if (continuer && partie.orbesEnAttente.every((o) => o.ouvert)) continuer.classList.remove("masque");
    }

    /* ================= Adversaires ================= */
    function genererEquipeAmicale(manche) {
      const gabarit = AMICAUX[manche - 1];
      const postes = ["GAR", "DÉF", "MIL", "ATT", "DÉF"].slice(0, gabarit.taille);
      const fiches = postes.map((poste, i) => gabarit.relevee && poste !== "GAR"
        ? hasardParmi(tousLesJoueurs.filter((j) => j.poste === poste && j.cout === 1))
        : { nom: ["Gégé", "Bernard", "Paulo", "Kiki", "Dédé"][i], cout: 0, poste, ecole: "", archetype: "", unique: null });
      return ONZE.equipeDepuisFiches(gabarit.nom, gabarit.nom, fiches); // nom seul dans le récit
    }
    /* Courbe calibrée (simulations/parties.js) : ~50 % de top 4 */
    function genererEquipeIA(coach) {
      const niveau = Math.min(3 + Math.floor(partie.manche / 4), 9);
      const taille = TITULAIRES_PAR_NIVEAU[niveau];
      let budget = Math.min(1 + 1.35 * partie.manche, 21);
      const compo = [];
      const besoins = ["GAR"];
      for (let i = 0; i < taille - 1; i++) besoins.push(["DÉF", "MIL", "ATT"][i % 3]);
      for (const poste of besoins) {
        const slotsRestants = besoins.length - compo.length;
        const coutMax = Math.max(1, Math.min(5, Math.floor(budget - (slotsRestants - 1))));
        let candidats = tousLesJoueurs.filter((j) => j.poste === poste && j.cout <= coutMax);
        const fideles = candidats.filter((j) => j.ecole === coach.ecole);
        if (fideles.length && Math.random() < 0.75) candidats = fideles;
        candidats.sort((a, b) => b.cout - a.cout);
        const choix = candidats[Math.floor(Math.random() * Math.min(3, candidats.length))] || candidats[0];
        if (choix) { compo.push(choix); budget -= choix.cout; }
      }
      return ONZE.equipeDepuisFiches(coach.nom, coach.nom, compo);
    }

    /* ================= Le déroulé des manches ================= */
    function preparerManche() {
      const amical = partie.manche <= DERNIERE_MANCHE_AMICALE;
      if (aPhilosophie("Académie des jeunes") && partie.banc.length < TAILLE_BANC) {
        const jeune = piocherJoueur(1);
        if (jeune) {
          partie.banc.push({ ...jeune, etoiles: 1 });
          const fusions = ONZE.fusionnerEffectif(partie.terrain, partie.banc);
          if (fusions.length) celebrerFusions(fusions);
        }
      }
      for (const c of partie.coachs) if (c.ia && c.vivant) c.equipe = genererEquipeIA(c);
      if (amical) {
        partie.appariement = { amical: true, nomAdversaire: "Amical — " + AMICAUX[partie.manche - 1].nom };
        return;
      }
      const autres = partie.coachs.filter((c) => c.vivant && c.ia).sort(() => Math.random() - 0.5);
      let indice = autres.findIndex((c) => c.nom !== partie.dernierAdversaire);
      if (indice === -1) indice = 0;
      const monAdversaire = autres.splice(indice, 1)[0];
      const pairesIA = [];
      while (autres.length >= 2) pairesIA.push([autres.shift(), autres.shift()]);
      partie.exempt = autres.length ? autres[0] : null;
      partie.appariement = { amical: false, monAdversaire, pairesIA, nomAdversaire: monAdversaire.nom };
    }

    function jouerManche() {
      const verdict = verdictFormation();
      if (verdict) return signaler(verdict);
      const amical = partie.appariement.amical;

      let monAdversaire = null, equipeAdverse, resultatsIA = [];
      if (amical) {
        equipeAdverse = genererEquipeAmicale(partie.manche);
      } else {
        monAdversaire = partie.appariement.monAdversaire;
        equipeAdverse = monAdversaire.equipe;
        resultatsIA = partie.appariement.pairesIA.map(([c1, c2]) => {
          const r = ONZE.simulerMatch(c1.equipe, c2.equipe);
          return { c1, c2, scoreA: r.scoreA, scoreB: r.scoreB };
        });
      }

      const monEquipe = equipeDuClub();
      const resultat = ONZE.simulerMatch(monEquipe, equipeAdverse);

      // Le match se joue SUR le terrain : tableau + journal par-dessus,
      // le tiroir reste ouvert (achats → banc)
      partie.matchEnCours = true;
      el("terrain-scene").style.paddingTop = "76px"; // laisse la place au tableau
      el("tableau-match").classList.remove("masque");
      el("nom-adversaire-match").textContent = "⚔️ " + (amical ? partie.appariement.nomAdversaire : monAdversaire.nom);
      el("btn-vitesse").classList.remove("masque");
      el("btn-match").disabled = true;
      el("btn-match").textContent = "⏱ Match…";
      el("recit").innerHTML = "";
      afficher();
      ONZE_UI.rejouer(resultat, monEquipe, equipeAdverse, {
        chrono: el("chrono"), scoreA: el("score-a"), scoreB: el("score-b"), recit: el("recit"),
      }, () => finDeManche(resultat, monAdversaire, resultatsIA), { sansPrestige: amical, manche: partie.manche });
    }

    function appliquerResultat(gagnant, perdant, ecart) {
      if (ecart === 0) { gagnant.serie = 0; perdant.serie = 0; return; }
      gagnant.serie = gagnant.serie > 0 ? gagnant.serie + 1 : 1;
      perdant.serie = perdant.serie < 0 ? perdant.serie - 1 : -1;
      perdant.prestige = Math.max(0, perdant.prestige - ONZE.degatsPrestige(ecart, partie.manche));
      if (perdant.prestige === 0) perdant.vivant = false;
    }

    function finDeManche(resultat, monAdversaire, resultatsIA) {
      const je = moi();
      const amical = partie.manche <= DERNIERE_MANCHE_AMICALE;
      const victoire = resultat.scoreA > resultat.scoreB;

      if (amical) {
        if (victoire) je.serie = je.serie > 0 ? je.serie + 1 : 1;
        else if (resultat.scoreB > resultat.scoreA) je.serie = je.serie < 0 ? je.serie - 1 : -1;
        else je.serie = 0;
      } else {
        if (victoire) appliquerResultat(je, monAdversaire, resultat.ecart);
        else if (resultat.scoreB > resultat.scoreA) appliquerResultat(monAdversaire, je, resultat.ecart);
        else appliquerResultat(je, monAdversaire, 0);
        for (const r of resultatsIA) {
          if (r.scoreA > r.scoreB) appliquerResultat(r.c1, r.c2, r.scoreA - r.scoreB);
          else if (r.scoreB > r.scoreA) appliquerResultat(r.c2, r.c1, r.scoreB - r.scoreA);
          else appliquerResultat(r.c1, r.c2, 0);
        }
      }

      const sponsors = Math.min(Math.floor(partie.or / 10), aPhilosophie("Mécènes") ? 7 : 5);
      const base = droitsTV(partie.manche) + (aPhilosophie("Droits TV majorés") ? 1 : 0);
      const serieAbs = Math.abs(je.serie);
      const bonusSerie = serieAbs >= 6 ? 3 : serieAbs >= 5 ? 2 : serieAbs >= 3 ? 1 : 0;
      const bonusVictoire = !amical && victoire ? (aPhilosophie("Guichets fermés") ? 2 : 1) : 0;
      const revenu = sponsors + base + bonusVictoire + bonusSerie;
      partie.or += revenu;
      gagnerXP(XP_GRATUITE_PAR_MANCHE + (aPhilosophie("Centre de formation") ? 1 : 0));
      if (partie.staffEnRetard && partie.manche >= partie.staffEnRetard) {
        partie.staffEnRetard = null;
        partie.staff.push(tirerCarteStaff());
        signaler("🧰 La carte staff promise est arrivée !");
      }

      partie.orbesEnAttente = amical
        ? partie.butin[partie.manche].map((rarete) => creerOrbe(rarete))
        : [];

      // Panneau de fin de manche par-dessus le terrain
      let html = `<div class="panneau">`;
      html += `<strong>Manche ${partie.manche} — ${resultat.scoreA} – ${resultat.scoreB}</strong>`;
      if (!amical) {
        html += `<div class="classement" style="margin-top:6px">`;
        for (const r of resultatsIA)
          html += `<div class="coach"><span>${r.c1.nom} ${r.scoreA} – ${r.scoreB} ${r.c2.nom}</span></div>`;
        if (partie.exempt) html += `<div class="coach"><span>${partie.exempt.nom} — exempt</span></div>`;
        html += `</div>`;
      }
      html += `<div class="coach" style="margin-top:6px"><span>💰 +${revenu}M (${base} droits TV` +
        (sponsors ? ` +${sponsors} sponsors` : "") + (bonusSerie ? ` +${bonusSerie} série` : "") +
        (bonusVictoire ? ` +1 victoire` : "") + `)</span></div>`;
      if (partie.orbesEnAttente.length) {
        html += `<div style="text-align:center;margin-top:8px"><strong>🎁 Le butin de l'amical !</strong><br>` +
          `<small style="color:#96A699">Touche chaque orbe pour l'ouvrir.</small></div><div class="orbes">` +
          partie.orbesEnAttente.map((o, i) => `<button class="orbe ${o.rarete}" onclick="ouvrirOrbe(this, ${i})">🎁</button>`).join("") +
          `</div>`;
      }
      html += `<button class="fermer-volet ${partie.orbesEnAttente.length ? "masque" : ""}" id="btn-continuer">➡️ Continuer</button></div>`;
      const volet = document.createElement("div");
      volet.className = "volet";
      volet.innerHTML = html;
      el("app").appendChild(volet);
      document.getElementById("btn-continuer").addEventListener("click", () => { volet.remove(); continuer(); });

      if (monAdversaire) partie.dernierAdversaire = monAdversaire.nom;
      const resume = amical
        ? `M${partie.manche} · ${resultat.scoreA}-${resultat.scoreB} ${partie.appariement.nomAdversaire} · +${revenu}M`
        : `M${partie.manche} · ${resultat.scoreA}-${resultat.scoreB} vs ${monAdversaire.nom} ` +
          (victoire ? "✅" : resultat.scoreA === resultat.scoreB ? "🤝" : `❌ -${ONZE.degatsPrestige(resultat.ecart, partie.manche)}💚`) +
          ` · +${revenu}M`;
      partie.historique.unshift(resume);
      partie.manche++;
    }

    function continuer() {
      partie.matchEnCours = false;
      el("terrain-scene").style.paddingTop = "";
      el("tableau-match").classList.add("masque");
      el("btn-vitesse").classList.add("masque");
      el("recit").innerHTML = "";
      const je = moi();
      const vivants = partie.coachs.filter((c) => c.vivant);
      if (!je.vivant || vivants.length === 1) {
        try { localStorage.removeItem(CLE_SAUVEGARDE); } catch (e) {}
        const place = je.vivant ? 1 : vivants.length + 1;
        const volet = document.createElement("div");
        volet.className = "volet";
        volet.innerHTML = `<div class="panneau" style="text-align:center">
          <div style="font-size:1.2rem;font-weight:800;margin-bottom:8px">${je.vivant ? "🏆 CHAMPION !" : "💔 Éliminé — " + place + "ᵉ sur 8"}</div>
          <div class="classement">${ligneClassement()}</div>
          <button class="fermer-volet" onclick="recommencerPartie()">🔁 Nouvelle partie</button>
        </div>`;
        el("app").appendChild(volet);
        return;
      }
      if (!partie.verrou) nouvelleBoutique();
      preparerManche();
      afficher();
      proposerPhilosophie();
      proposerMercatoHiver();
    }

    /* Le Mercato d'hiver (le carrousel de TFT) : aux manches 8 et 13,
       un étal de joueurs dont certains arrivent avec une carte staff.
       La priorité va aux clubs en difficulté : mieux tu es classé,
       moins il reste de choix quand ton tour arrive. */
    const MANCHES_MERCATO_HIVER = [8, 13];
    function proposerMercatoHiver() {
      if (!MANCHES_MERCATO_HIVER.includes(partie.manche)) return;
      if (partie.hiversVus.includes(partie.manche)) return;
      partie.hiversVus.push(partie.manche);
      // ton rang au prestige (0 = dernier → premier servi, tout l'étal)
      const vivants = partie.coachs.filter((c) => c.vivant);
      const rang = vivants.slice().sort((a, b) => a.prestige - b.prestige).indexOf(moi());
      const nbChoix = Math.max(2, 6 - rang);
      const etal = [];
      for (let i = 0; i < nbChoix; i++) {
        const fiche = piocherJoueur(3);
        if (!fiche) break;
        etal.push({ fiche, carte: Math.random() < 0.5 ? tirerCarteStaff() : null });
      }
      if (!etal.length) return;
      const volet = document.createElement("div");
      volet.className = "volet";
      volet.innerHTML = `<div class="panneau" style="text-align:center">
        <strong>❄️ Le Mercato d'hiver</strong><br>
        <small style="color:#96A699">Un joueur offert — les clubs en difficulté ont été servis avant toi${rang > 0 ? " (" + rang + " déjà passés)" : ""}.</small>
        ${etal.map((choix, i) => {
          const stats = ONZE.genererStats(choix.fiche);
          return `<button class="fermer-volet" style="text-align:left" data-hiver="${i}">
            <strong>${ONZE.noteGlobale(stats)} ${choix.fiche.poste} · ${choix.fiche.nom}</strong> <span style="color:#E8C547">${choix.fiche.cout}M</span>
            ${choix.carte ? ` + 🧰 ${choix.carte}` : ""}<br>
            <small style="color:#96A699">${choix.fiche.ecole || "Sans École"} · ${choix.fiche.archetype}</small></button>`;
        }).join("")}
      </div>`;
      volet.addEventListener("click", (e) => {
        const bouton = e.target.closest("[data-hiver]");
        if (!bouton) return;
        const choix = etal[Number(bouton.dataset.hiver)];
        // les joueurs non choisis retournent dans le pool
        etal.forEach((autre, i) => { if (i !== Number(bouton.dataset.hiver)) partie.pool.push(autre.fiche); });
        const copie = { ...choix.fiche, etoiles: 1 };
        if (choix.carte) ONZE.assignerCarte(copie, choix.carte);
        if (partie.terrain.length < TITULAIRES_PAR_NIVEAU[partie.niveau]) partie.terrain.push(copie);
        else if (partie.banc.length < TAILLE_BANC) partie.banc.push(copie);
        else { partie.pool.push(choix.fiche); signaler("Effectif plein — le transfert a capoté !"); volet.remove(); return; }
        const fusions = ONZE.fusionnerEffectif(partie.terrain, partie.banc);
        if (fusions.length) celebrerFusions(fusions);
        volet.remove();
        signaler(`❄️ ${choix.fiche.nom} signe au club${choix.carte ? " avec " + choix.carte : ""} !`);
        afficher();
      });
      el("app").appendChild(volet);
    }

    function proposerPhilosophie() {
      if (!MANCHES_PHILOSOPHIE.includes(partie.manche)) return;
      if (partie.philosophiesVues.includes(partie.manche)) return;
      partie.philosophiesVues.push(partie.manche);
      const choix = PHILOSOPHIES.filter((p) => !partie.philosophies.includes(p.nom))
        .sort(() => Math.random() - 0.5).slice(0, 3);
      const volet = document.createElement("div");
      volet.className = "volet";
      volet.innerHTML = `<div class="panneau" style="text-align:center">
        <strong>🧭 Choisis la Philosophie de ton club</strong><br>
        <small style="color:#96A699">Un seul choix — définitif jusqu'à la fin de la partie.</small>
        ${choix.map((p, i) => `<button class="fermer-volet" style="text-align:left" data-philo="${i}">
          ${p.emoji} <strong>${p.nom}</strong><br><small style="color:#96A699">${p.desc}</small></button>`).join("")}
      </div>`;
      volet.addEventListener("click", (e) => {
        const bouton = e.target.closest("[data-philo]");
        if (!bouton) return;
        const philo = choix[Number(bouton.dataset.philo)];
        partie.philosophies.push(philo.nom);
        if (philo.nom === "Trésor de guerre") partie.or += 10;
        if (philo.nom === "Direction patiente") moi().prestige = Math.min(PRESTIGE_DEPART, moi().prestige + 10);
        if (philo.nom === "Organigramme étoffé") { partie.staff.push(tirerCarteStaff()); partie.staffEnRetard = partie.manche + 3; }
        if (philo.nom === "Réseau de recruteurs") { partie.tailleBoutique = 6; nouvelleBoutique(); }
        volet.remove();
        signaler(philo.emoji + " " + philo.nom + " adoptée !");
        afficher();
      });
      el("app").appendChild(volet);
    }

    /* ================= Volet classement / scouting ================= */
    function ligneClassement() {
      return partie.coachs.slice().sort((a, b) => b.prestige - a.prestige).map((c) => {
        const classes = "coach" + (c.ia ? "" : " moi") + (c.vivant ? "" : " mort");
        const serie = c.serie > 1 ? ` 🔥${c.serie}` : "";
        const indice = partie.coachs.indexOf(c);
        return `<div class="${classes}" style="cursor:pointer" onclick="scouterIndice(${indice})"><span>🔎 ${c.nom}${serie}</span><span>💚 ${c.prestige}</span></div>`;
      }).join("");
    }
    function ouvrirClassement() {
      const volet = document.createElement("div");
      volet.className = "volet";
      volet.innerHTML = `<div class="panneau">
        <strong>🏆 Le tournoi</strong>
        <div class="classement" style="margin-top:6px">${ligneClassement()}</div>
        <div class="coach" style="margin-top:4px;color:#96A699"><span id="annonce-volet"></span></div>
        ${partie.philosophies.length ? `<div class="coach" style="margin-top:4px"><span>🧭 ${partie.philosophies.join(" · ")}</span></div>` : ""}
        <button class="fermer-volet" style="background:#3A2A24;color:#D4A66B" onclick="if (confirm('Abandonner cette partie ?')) recommencerPartie()">🔁 Nouvelle partie</button>
        <details style="margin-top:8px"><summary style="cursor:pointer;color:#96A699;font-size:0.8rem">📜 Historique des manches</summary>
        <div style="font-size:0.76rem;margin-top:4px">${partie.historique.map((h) => `<div class="coach"><span>${h}</span></div>`).join("") || "La saison commence."}</div></details>
        <button class="fermer-volet">Fermer</button>
      </div>`;
      volet.addEventListener("click", (e) => { if (e.target === volet || e.target.classList.contains("fermer-volet")) volet.remove(); });
      el("app").appendChild(volet);
      const annonce = partie.appariement.amical
        ? `🤝 Prochain match : ${partie.appariement.nomAdversaire} (aucun dégât)`
        : `⚔️ Prochain adversaire : ${partie.appariement.nomAdversaire} — touche-le pour scouter`;
      document.getElementById("annonce-volet").textContent = annonce;
    }
    function scouterIndice(indice) {
      const coach = partie.coachs[indice];
      if (!coach.ia) return ouvrirVestiaire(null);
      if (!coach.vivant) return signaler(coach.nom + " a déjà quitté le tournoi.");
      ouvrirVestiaire(coach);
    }
    function ouvrirVestiaire(coach) {
      const equipe = coach
        ? (coach.equipe || genererEquipeIA(coach))
        : equipeDuClub();
      const axes = ONZE.adnClub(equipe);
      const valeursAxes = Object.values(axes);
      const maxAxe = Math.max(...valeursAxes), minAxe = Math.min(...valeursAxes);
      const voile = document.createElement("div");
      voile.className = "voile-fiche";
      voile.innerHTML = `<div class="fiche-joueur">
        <h3>🔎 ${equipe.nom}</h3>
        <div class="sous-titre">${coach ? "École " + coach.ecole + " · vestiaire scouté" : "ton propre vestiaire"}</div>
        <div class="synergies" style="margin-bottom:8px">${ONZE_UI.badges(equipe)}</div>
        ${equipe.joueurs.map((j) => `<div class="ligne-stat"><span class="nom-stat">${j.poste}</span>` +
          `<span style="flex:1">${j.nom}</span><span class="valeur-stat">${j.note}</span></div>`).join("")}
        <div style="margin-top:8px">${Object.entries(axes).map(([axe, valeur]) => {
          const classe = valeur === maxAxe && maxAxe > minAxe ? "forte" : valeur === minAxe && maxAxe > minAxe ? "faible" : "";
          return `<div class="axe"><span class="nom-axe">${axe}</span><span class="barre-axe"><div class="${classe}" style="width:${valeur}%"></div></span><span class="valeur-axe">${valeur}</span></div>`;
        }).join("")}</div>
        <button class="fermer">Fermer</button>
      </div>`;
      voile.addEventListener("click", (e) => { if (e.target === voile || e.target.classList.contains("fermer")) voile.remove(); });
      el("app").appendChild(voile);
    }

    /* ================= Le staff : assignation ================= */
    function assignerStaff(indiceCarte) {
      const carte = partie.staff[indiceCarte];
      if (!carte) return;
      const tous = [
        ...partie.terrain.map((j, i) => ({ j, ref: "terrain:" + i })),
        ...partie.banc.map((j, i) => ({ j, ref: "banc:" + i })),
      ];
      const voile = document.createElement("div");
      voile.className = "voile-fiche";
      voile.innerHTML = `<div class="fiche-joueur" style="max-width:320px">
        <h3>🧰 ${carte}</h3>
        <div class="sous-titre">${carte === "Passeport" ? "Combiné, il donne un emblème d'École." :
          "Choisis le joueur qui reçoit cette carte (2 cartes = spécialisation)."}</div>
        ${tous.map(({ j, ref }) => {
          const slots = (j.staffCartes || []).length + (j.specialisations || []).length;
          return `<button class="fermer" style="text-align:left" data-ref="${ref}">
            ${j.poste} ${j.nom}${(j.etoiles || 1) >= 2 ? " " + "★".repeat(j.etoiles) : ""}
            ${slots ? " · 🧪" + slots : ""}${j.staffCartes && j.staffCartes.length ? " (" + j.staffCartes.join(", ") + ")" : ""}</button>`;
        }).join("")}
        <button class="fermer" data-ref="annuler">Annuler</button>
      </div>`;
      voile.addEventListener("click", (e) => {
        const ref = e.target.dataset && e.target.dataset.ref;
        if (e.target === voile) return voile.remove();
        if (!ref) return;
        voile.remove();
        if (ref === "annuler") return;
        const [nomListe, indice] = ref.split(":");
        const fiche = partie[nomListe][Number(indice)];
        const resultat = ONZE.assignerCarte(fiche, carte);
        if (!resultat.ok) return signaler(resultat.raison);
        partie.staff.splice(indiceCarte, 1);
        celebrerStaff(resultat.evenement);
        afficher();
      });
      el("app").appendChild(voile);
    }
    function celebrerStaff(evenement) {
      if (!evenement || evenement.type === "composant") return;
      const banniere = document.createElement("div");
      banniere.className = "fusion-banniere";
      if (evenement.type === "spec") {
        const spec = Object.values(ONZE.SPECIALISATIONS).find((x) => x.nom === evenement.nom);
        banniere.innerHTML = `🧪 SPÉCIALISATION ! 🧪<br>${evenement.joueur} devient <strong>${evenement.nom}</strong><small>${spec && spec.effet ? spec.effet : "Deux cartes staff fusionnées — définitif."}</small>`;
      } else if (evenement.type === "embleme") {
        banniere.innerHTML = `🛂 EMBLÈME ! 🛂<br>${evenement.joueur} rejoint <strong>${evenement.ecole}</strong><small>Le Passeport a parlé — il compte dans l'École.</small>`;
      } else {
        banniere.innerHTML = `🌍 CITOYEN DU MONDE ! 🌍<br>${evenement.joueur} compte dans TOUTES tes Écoles actives.`;
      }
      el("app").appendChild(banniere);
      setTimeout(() => banniere.remove(), 3000);
    }

    /* ================= Le menu d'un joueur (jeton ou banc) ================= */
    function menuJoueur(nomListe, indice) {
      const fiche = partie[nomListe][indice];
      if (!fiche) return;
      const valeurVente = fiche.cout * Math.pow(3, (fiche.etoiles || 1) - 1);
      const voile = document.createElement("div");
      voile.className = "voile-fiche";
      voile.innerHTML = `<div class="fiche-joueur" style="max-width:280px;text-align:center">
        <h3>${fiche.nom}${(fiche.etoiles || 1) >= 2 ? " " + "★".repeat(fiche.etoiles) : ""}</h3>
        <div class="sous-titre">${fiche.poste}${fiche.ecole ? " · " + fiche.ecole : ""}${fiche.archetype ? " · " + fiche.archetype : ""}</div>
        <button class="fermer" data-action="fiche">📋 Voir la fiche</button>
        <button class="fermer" data-action="bouger">${nomListe === "terrain" ? "🪑 Envoyer au banc" : "⬆️ Titulariser"}</button>
        <button class="fermer" style="background:#3A2A24;color:#D4A66B" data-action="vendre">💰 Vendre (${valeurVente}M)</button>
        <button class="fermer" data-action="rien">Annuler</button>
      </div>`;
      voile.addEventListener("click", (e) => {
        const action = e.target.dataset && e.target.dataset.action;
        if (e.target === voile) return voile.remove();
        if (!action) return;
        voile.remove();
        if (action === "fiche") {
          let calcule = null;
          if (nomListe === "terrain") calcule = equipeDuClub().joueurs[indice];
          ONZE_UI.ouvrirFiche(fiche, calcule);
        }
        if (action === "bouger") basculer(nomListe, indice);
        if (action === "vendre") vendre(nomListe, indice);
      });
      el("app").appendChild(voile);
    }

    /* ================= Affichage de l'écran unique ================= */
    function jetonHTML(fiche, nomListe, indice) {
      const stats = ONZE.genererStats(fiche);
      const note = ONZE.noteGlobale(stats);
      const etoiles = (fiche.etoiles || 1) >= 2 ? `<span class="etoiles">${"★".repeat(fiche.etoiles)}</span>` : "";
      const nbSpecs = (fiche.specialisations || []).length;
      const nbCartes = (fiche.staffCartes || []).length;
      const staff = nbSpecs || nbCartes
        ? `<br><span style="font-size:0.5rem">${"🧪".repeat(nbSpecs)}${"🧰".repeat(nbCartes)}${fiche.ecoleBonus ? "🛂" : ""}</span>` : "";
      return `<div class="jeton cout-${fiche.cout}" onclick="menuJoueur('${nomListe}', ${indice})">
        <span class="note-jeton">${note}</span> ${etoiles}<br>${fiche.nom}${staff}</div>`;
    }
    function afficher() {
      const max = TITULAIRES_PAR_NIVEAU[partie.niveau];
      el("manche").textContent = partie.manche;
      el("prestige").textContent = moi().prestige;
      el("or").textContent = partie.or;
      el("niveau").textContent = partie.niveau;
      el("xp").textContent = partie.xp;
      el("xp-suivant").textContent = XP_POUR_MONTER[partie.niveau] || "MAX";
      el("serie").textContent = moi().serie > 0 ? "🔥" + moi().serie : moi().serie < 0 ? "❄️" + (-moi().serie) : "—";
      el("staff").textContent = partie.staff.length;

      // Le terrain : les titulaires à leur ligne + les places libres
      for (const poste of ["GAR", "DÉF", "MIL", "ATT"]) el("ligne-" + poste).innerHTML = "";
      partie.terrain.forEach((fiche, i) => {
        el("ligne-" + fiche.poste).insertAdjacentHTML("beforeend", jetonHTML(fiche, "terrain", i));
      });
      const libres = max - partie.terrain.length;
      for (let i = 0; i < libres; i++)
        el("ligne-MIL").insertAdjacentHTML("beforeend", `<div class="jeton vide">+</div>`);

      // Banc et boutique dans le tiroir
      el("banc").innerHTML = partie.banc.length
        ? partie.banc.map((fiche, i) => jetonHTML(fiche, "banc", i)).join("")
        : `<div class="jeton vide" style="flex:1">Banc vide (${TAILLE_BANC} places)</div>`;
      el("boutique").innerHTML = partie.boutique.map((fiche, i) => {
        if (!fiche) return `<div class="carte-boutique vendue">—</div>`;
        const stats = ONZE.genererStats(fiche);
        const note = ONZE.noteGlobale(stats);
        const signatures = ONZE.statsSignatures(stats).map((x) => `${x.nom} ${x.valeur}`).join(" · ");
        return `<div class="carte-boutique cout-${fiche.cout}" onclick="ONZE_UI.ouvrirFiche(tousLesJoueurs.find((j) => j.nom === '${fiche.nom.replace(/'/g, "\\'")}'))">
          <span class="haut"><span>${note} ${fiche.poste}</span><span class="prix">${fiche.cout}M</span></span>
          <span><strong>${fiche.nom}</strong></span>
          <span class="signatures">${signatures}</span>
          <span class="traits-carte">${fiche.unique ? "⭐ " + fiche.unique : (fiche.ecole || "")}<br>${fiche.archetype || ""}</span>
          <button onclick="event.stopPropagation(); acheter(${i})" ${partie.or < fiche.cout ? "disabled" : ""}>Recruter ${fiche.cout}M</button>
        </div>`;
      }).join("");

      el("btn-refresh").disabled = partie.or < COUT_REFRESH;
      el("btn-xp").disabled = partie.or < COUT_XP || partie.niveau >= 10;
      el("btn-verrou").textContent = partie.verrou ? "🔒" : "🔓";

      // Synergies + mini ADN
      const apercu = equipeDuClub();
      el("synergies-club").innerHTML = ONZE_UI.badges(apercu) ||
        `<span style="color:#5A6A5C;font-size:0.68rem">Réunis des joueurs d'une même École ou d'un même archétype.</span>`;
      const axes = ONZE.adnClub(apercu);
      const valeursAxes = Object.values(axes);
      const maxAxe = Math.max(...valeursAxes), minAxe = Math.min(...valeursAxes);
      el("axes-adn").innerHTML = Object.entries(axes).map(([axe, valeur]) => {
        const classe = valeur === maxAxe && maxAxe > minAxe ? "forte" : valeur === minAxe && maxAxe > minAxe ? "faible" : "";
        return `<div class="axe-mini"><div class="barre-mini"><div class="${classe}" style="width:${valeur}%"></div></div>${axe}</div>`;
      }).join("");

      // L'inventaire staff (colonne gauche) — tap = assigner
      el("inventaire-staff").innerHTML = partie.staff.length
        ? `<span style="color:#96A699;font-size:0.58rem;text-transform:uppercase;letter-spacing:1px">🧰 Staff à assigner</span>` +
          partie.staff.map((carte, i) =>
            `<span class="badge${carte === "Passeport" ? " presque" : ""}" style="cursor:pointer;display:block;text-align:left" onclick="assignerStaff(${i})">${carte === "Passeport" ? "🛂" : "🧰"} ${carte}</span>`).join("")
        : "";

      // Annonce du prochain adversaire (barre du haut)
      el("annonce").textContent = partie.matchEnCours ? ""
        : partie.appariement.amical
          ? `🤝 ${partie.appariement.nomAdversaire} (aucun dégât)`
          : `⚔️ Prochain adversaire : ${partie.appariement.nomAdversaire}`;

      // Classement permanent en colonne droite (copie TFT), tap = scouting
      el("classement-liste").innerHTML = partie.coachs.slice()
        .sort((a, b) => b.prestige - a.prestige).map((c) => {
          const indice = partie.coachs.indexOf(c);
          const classes = "coach-ligne" + (c.ia ? "" : " moi") + (c.vivant ? "" : " mort");
          const serie = c.serie > 1 ? " 🔥" : c.serie < -1 ? " ❄️" : "";
          return `<div class="${classes}" onclick="scouterIndice(${indice})">${c.nom}${serie}
            <div class="barre-prestige"><div style="width:${Math.round(100 * c.prestige / PRESTIGE_DEPART)}%"></div></div></div>`;
        }).join("");

      // Bouton de manche
      if (!partie.matchEnCours) {
        const verdict = verdictFormation();
        el("btn-match").disabled = !!verdict;
        el("btn-match").textContent = verdict ? "⚽ " + verdict
          : `⚽ Manche ${partie.manche}` + (formationIncomplete() ? " 😬" : "");
      }
      sauvegarder();
    }

    /* ================= Sauvegarde locale =================
       C'est une app : la partie en cours survit au rechargement.
       On ne sauvegarde jamais en plein match — au pire on rejoue
       la manche en cours. */
    const CLE_SAUVEGARDE = "onze-partie-v1";
    function sauvegarder() {
      if (!partie || partie.matchEnCours) return;
      try {
        const copie = { ...partie, appariement: null, orbesEnAttente: [] };
        copie.coachs = partie.coachs.map((c) => { const { equipe, ...reste } = c; return reste; });
        localStorage.setItem(CLE_SAUVEGARDE, JSON.stringify(copie));
      } catch (e) { /* stockage indisponible : on joue sans filet */ }
    }
    function restaurer() {
      try {
        const brut = localStorage.getItem(CLE_SAUVEGARDE);
        if (!brut) return false;
        const sauvegarde = JSON.parse(brut);
        if (!sauvegarde || !sauvegarde.coachs || !sauvegarde.terrain) return false;
        partie = sauvegarde;
        partie.matchEnCours = false;
        partie.orbesEnAttente = [];
        preparerManche();
        afficher();
        proposerPhilosophie();
        proposerMercatoHiver();
        signaler("💾 Partie reprise — manche " + partie.manche + ".");
        return true;
      } catch (e) { return false; }
    }
    function recommencerPartie() {
      try { localStorage.removeItem(CLE_SAUVEGARDE); } catch (e) {}
      document.querySelectorAll(".volet, .voile-fiche").forEach((v) => v.remove());
      nouvellePartie();
    }

    /* ================= Mise en place ================= */
    fetch("design/joueurs.json")
      .then((rep) => rep.json())
      .then((donnees) => {
        tousLesJoueurs = donnees;
        el("btn-match").addEventListener("click", jouerManche);
        el("btn-refresh").addEventListener("click", refresh);
        el("btn-xp").addEventListener("click", acheterXP);
        el("btn-historique").addEventListener("click", ouvrirClassement);
        el("btn-verrou").addEventListener("click", () => {
          partie.verrou = !partie.verrou;
          signaler(partie.verrou ? "🔒 La boutique t'attendra à la prochaine manche." : "🔓 Boutique déverrouillée.");
          afficher();
        });
        el("btn-vitesse").addEventListener("click", () => {
          const v = ONZE_UI.basculerVitesse();
          el("btn-vitesse").textContent = v === 2 ? "▶️ ×1" : "⏩ ×2";
        });
        if (!restaurer()) nouvellePartie();
      })
      .catch((e) => {
        el("btn-match").textContent = "Erreur de chargement des joueurs";
        console.error(e);
      });
  </script>

</body>
</html>
